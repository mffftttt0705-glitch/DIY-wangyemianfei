      h += '<label style="display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px;color:var(--text);"><input type="checkbox" '+(props.effectUnderline?'checked':'')+' onchange="updateProp(\'effectUnderline\', this.checked)"> 底部划线</label>';
      h += '<label style="display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px;color:var(--text);"><input type="checkbox" '+(props.effectStroke?'checked':'')+' onchange="updateProp(\'effectStroke\', this.checked)"> 描边变粗</label>';
      h += '</div></div>';
      return h;
    }

    function renderProps() {
      var body = document.getElementById('propsBody');
      if (!body) return;
      if (previewMode) {
        body.innerHTML = '<div class="props-empty">预览模式 · 可点击跳转 / 搜索</div>';
        return;
      }
      var els = getElements();
      var el = null;
      for (var i=0;i<els.length;i++) if (els[i].id===selectedId) { el=els[i]; break; }
      if (!el) {
        body.innerHTML = '<div class="props-empty">选中画布组件后在此编辑<br>点空白处返回添加组件</div>';
        if (typeof sheetMode !== 'undefined' && sheetMode === 'props') showSheetComps();
        return;
      }
      var def = getDef(el.type);
      var props = el.props;
      var sc = el.scale != null ? el.scale : 1;
      var html = '<div class="props-header-row"><strong>'+esc(def.name)+'</strong><button class="props-back" type="button" onclick="selectedId=null;selectedSlot=null;renderCanvas();renderProps();showSheetComps();">返回组件</button></div>';

      html += '<div class="prop-group"><label>大小（也可拖选中框四角）</label>';
      html += '<input type="range" min="40" max="250" value="'+Math.round(sc*100)+'" oninput="setElementScale(selectedId, this.value/100);var t=this.nextElementSibling;if(t)t.textContent=this.value+\'%\';" style="width:100%;">';
      html += '<div style="font-size:12px;color:var(--muted);margin-top:4px;">'+Math.round(sc*100)+'%</div></div>';

      var layout = el.layout || 'flow';
      var pin = el.pin || '';
      html += '<div class="prop-group"><label>放置方式</label><div style="display:flex;gap:6px;flex-wrap:wrap;">';
      html += '<button type="button" class="'+(layout==='flow'&&!pin?'btn-primary':'btn-secondary')+'" style="padding:6px 10px;font-size:12px;" onclick="setElementPin(\'\');setElementLayout(\'flow\')">顺序排列</button>';
      html += '<button type="button" class="'+(layout==='free'&&!pin?'btn-primary':'btn-secondary')+'" style="padding:6px 10px;font-size:12px;" onclick="setElementPin(\'\');setElementLayout(\'free\')">自由拖放</button>';
      html += '</div></div>';
      html += '<div class="prop-group"><label>固定在屏幕</label><div style="display:flex;gap:6px;flex-wrap:wrap;">';
      html += '<button type="button" class="'+(!pin?'btn-primary':'btn-secondary')+'" style="padding:6px 10px;font-size:12px;" onclick="setElementPin(\'\')">不固定</button>';
      html += '<button type="button" class="'+(pin==='top'?'btn-primary':'btn-secondary')+'" style="padding:6px 10px;font-size:12px;" onclick="setElementPin(\'top\')">固定顶部</button>';
      html += '<button type="button" class="'+(pin==='bottom'?'btn-primary':'btn-secondary')+'" style="padding:6px 10px;font-size:12px;" onclick="setElementPin(\'bottom\')">固定底部</button>';
      html += '</div><p style="font-size:11px;color:var(--muted);margin-top:6px;">自由拖放：按住组件移动；固定后贴在手机屏顶/底</p></div>';


      var isIconType = (el.type || '').indexOf('icon-') === 0;
      if (isIconType) {
        html += renderSelectionEffectProps(props, true);
        // 基础颜色、大小、跳转
        html += '<div class="prop-group"><label>默认颜色（未选中）</label><div class="color-row"><input type="color" value="'+toHex(props.color||'#374151')+'" oninput="updateProp(\'color\', this.value)"></div></div>';
        html += '<div class="prop-group"><label>图标大小</label><input type="number" min="12" value="'+(props.size||24)+'" onchange="updateProp(\'size\', +this.value||24)"></div>';
        html += '<div class="prop-group"><label>点击跳转页面</label>'+pageSelectHtml(props.linkPageId||'', "updateProp('linkPageId', this.value)")+'</div>';
        body.innerHTML = html;
        return;
      }
      if (el.type === 'nav-bottom' || el.type === 'filter-tabs' || el.type === 'detail-tabs') {
        html += renderSelectionEffectProps(props, false);
      }

      if (el.type === 'nav-top' || el.type === 'nav-bottom' || el.type === 'nav-back') {
        html += '<div class="prop-group"><label>背景色</label><div class="color-row"><input type="color" value="'+toHex(props.bgColor||'#ffffff')+'" oninput="updateProp(\'bgColor\',this.value)"></div></div>';
        if (props.textColor != null) {
          html += '<div class="prop-group"><label>文字色</label><div class="color-row"><input type="color" value="'+toHex(props.textColor)+'" oninput="updateProp(\'textColor\',this.value)"></div></div>';
        }
        if (props.activeColor != null) {
          html += '<div class="prop-group"><label>选中色</label><div class="color-row"><input type="color" value="'+toHex(props.activeColor)+'" oninput="updateProp(\'activeColor\',this.value)"></div></div>';
        }
        html += '<div class="prop-group"><label>高度</label><input type="number" min="36" value="'+(props.height||48)+'" onchange="updateProp(\'height\',+this.value||48)"></div>';
        html += renderNavItemsEditor(el);
        body.innerHTML = html;
        return;
      }

      var pageLinkKeys = getPageLinkKeys(el.type);
      var keys = Object.keys(props);
      for (var k=0;k<keys.length;k++) {
        var key = keys[k];
        if (key === 'items') continue;
        var val = props[key];
        var isColor = /color|Color|bgColor|textColor|borderColor|priceColor|btnColor|activeColor|inactiveColor/i.test(key);
        var isPage = pageLinkKeys.indexOf(key) >= 0 || key === 'linkPageId';
        var isSize = /size|height|radius|imgHeight|imgSize|fontSize|padding/i.test(key);
        var label = propLabel(key);
        if (isPage) {
          html += '<div class="prop-group"><label>'+label+'</label>'+pageSelectHtml(val, "updateProp('"+key+"', this.value)")+'</div>';
        } else if (isColor) {
          html += '<div class="prop-group"><label>'+label+'</label><div class="color-row"><input type="color" value="'+toHex(val)+'" oninput="updateProp(\''+key+'\', this.value)"><input type="text" value="'+esc(val)+'" onchange="updateProp(\''+key+'\', this.value)" style="flex:1;"></div></div>';
        } else if (isSize || typeof val === 'number') {
          html += '<div class="prop-group"><label>'+label+'</label><input type="number" min="0" value="'+val+'" onchange="updateProp(\''+key+'\', +this.value||0)"></div>';
        } else if (typeof val === 'string' || val == null) {
          html += '<div class="prop-group"><label>'+label+'</label><input type="text" value="'+esc(val==null?'':val)+'" onchange="updateProp(\''+key+'\', this.value)" placeholder="留空则不显示"></div>';
        }
      }
      body.innerHTML = html;
    }

    function getPageLinkKeys(type) {
      var map = {
        'nav-top': ['logoPage','menu1Page','menu2Page','right1Page','right2Page'],
        'nav-bottom': ['page1','page2','page3','page4'],

        'btn-outline': ['linkPageId'],
        'banner': ['linkPageId'],
        'buy-bar': ['cartPage','buyPage'],
        'coupon-bar': ['linkPageId'],
        'notice-bar': ['linkPageId'],
        'image-block': ['linkPageId'],
        'float-btn': ['linkPageId'],
        'address-bar': ['linkPageId'],
        'product-card': ['linkPageId'],
        'product-list': ['linkPageId'],
        'icon-cart': ['linkPageId'],
        'icon-heart': ['linkPageId'],
        'icon-search': ['linkPageId'],
        'icon-user': ['linkPageId'],
        'icon-home': ['linkPageId'],

    function propLabel(key) {
      var map = {
        color:'颜色', size:'图标大小', bgColor:'背景色', textColor:'文字颜色',
        logoText:'Logo', menu1:'菜单1', menu2:'菜单2',
        menu1Page:'菜单1跳转', menu2Page:'菜单2跳转', cartPage:'购物车跳转',
        text:'按钮文字', radius:'圆角', borderColor:'边框色', height:'高度',
        title:'标题', subtitle:'副标题', bgColor1:'渐变色1', bgColor2:'渐变色2',
        placeholder:'占位提示', name:'商品名称', price:'价格', originPrice:'原价',
        sales:'销量文案', priceColor:'价格颜色', btnColor:'按钮颜色', btnText:'按钮文字',
        imgHeight:'图片高度', imgSize:'图片尺寸', linkPageId:'点击跳转页面',
        tab1:'Tab1', tab2:'Tab2', tab3:'Tab3', tab4:'Tab4',
        page1:'Tab1跳转', page2:'Tab2跳转', page3:'Tab3跳转', page4:'Tab4跳转',
        activeColor:'选中色', inactiveColor:'未选中色', backPage:'返回跳转',
        moreText:'更多文字', morePage:'更多跳转', fontSize:'字号', align:'对齐', padding:'内边距'

    function toHex(c) {
      if (!c) return '#000000';
      if (c.indexOf('#')===0 && c.length===7) return c;

    function updateProp(key, value) {
      var els = getElements();
      for (var i=0;i<els.length;i++) {
        if (els[i].id === selectedId) {
          els[i].props[key] = value;
          break;
        }
      }
      renderCanvas();
      if (/color|Color|Page|linkPage|Icon|icon|tab|menu|logo|right|title|text|Active|effect|activeIndex/i.test(key)) renderProps();
    }

    // ========== 预览模式 ==========

      previewMode = !previewMode;

    // ========== 导出 ==========
    function generateFullHTML() {
      var proj = getProject();
      if (!proj) return '';
      var title = proj.title || '我的页面';
      // 导出时生成带简单 JS 的多页 HTML
      var pagesData = proj.pages.map(function(pg) {
        var body = (pg.elements||[]).map(function(el) {
          var def = getDef(el.type);
          var sc = (el.scale != null ? el.scale : 1);
          var inner = def ? def.render(el.props, { preview: true }) : '';
          var st = '';
          if (el.pin === 'top') st = 'position:sticky;top:0;z-index:50;';
          else if (el.pin === 'bottom') st = 'position:sticky;bottom:0;z-index:50;';
          else if (el.layout === 'free') st = 'position:absolute;left:'+(el.x||0)+'px;top:'+(el.y||0)+'px;';
          if (sc !== 1) st += 'transform:scale('+sc+');transform-origin:top left;';
          return st ? '<div style="'+st+'">'+inner+'</div>' : inner;
        }).join('\n');
        return { id: pg.id, name: pg.name, html: body };
      });

      var pagesJson = JSON.stringify(pagesData.map(function(p){ return { id: p.id, name: p.name }; }));
      var pagesHtml = pagesData.map(function(p, i) {
        return '<div class="page" id="page_'+p.id+'" style="'+(i===0?'':'display:none;')+'">'+p.html+'</div>';
      }).join('\n');

      return '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">\n<title>'+esc(title)+'</title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box;}\nbody{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#111;max-width:430px;margin:0 auto;min-height:100vh;position:relative;}\n.preview-search-input{flex:1;border:none;background:transparent;outline:none;font-size:14px;color:#111;}\n</style>\n</head>\n<body>\n'+pagesHtml+'\n<script>\n'+
        'var pages='+pagesJson+';\n'+
        'function goPage(id){\n'+
        '  if(!id)return;\n'+
        '  document.querySelectorAll(".page").forEach(function(el){el.style.display="none";});\n'+
        '  var t=document.getElementById("page_"+id);\n'+
        '  if(t)t.style.display="block";\n'+
        '  window.scrollTo(0,0);\n'+
        '}\n'+
        'document.body.addEventListener("click",function(e){\n'+
        '  var t=e.target.closest("[data-page]");\n'+
        '  if(t){var id=t.getAttribute("data-page");if(id){e.preventDefault();goPage(id);}}\n'+
        '});\n'+
        'document.body.addEventListener("input",function(e){\n'+
        '  if(e.target.getAttribute("data-role")==="search"){\n'+
        '    var q=e.target.value.toLowerCase();\n'+
        '    var page=e.target.closest(".page");\n'+
        '    if(!page)return;\n'+
        '    page.querySelectorAll("[data-product]").forEach(function(el){\n'+
        '      var name=(el.getAttribute("data-product")||"").toLowerCase();\n'+
        '      el.style.display=(!q||name.indexOf(q)>=0)?"":"none";\n'+
        '    });\n'+
        '  }\n'+
        '});\n'+
        '<\/script>\n</body>\n</html>';
    }

    function exportHTML() {
      var proj = getProject();
      if (!proj) return;
      var hasContent = false;
      proj.pages.forEach(function(pg){ if (pg.elements && pg.elements.length) hasContent = true; });
      if (!hasContent) { showAlert('提示', '画布为空，请先添加组件'); return; }
      var html = generateFullHTML();
      var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (proj.title || 'page').replace(/[\\/:*?"<>|]/g, '_') + '.html';
      a.click();
      URL.revokeObjectURL(a.href);
      toast('已导出（含多页跳转与搜索）');
    }

    function showPublishModal() {
      if (!currentProjectId) { showAlert('提示', '请先保存项目'); return; }
      document.getElementById('publishError').textContent = '';
      document.getElementById('publishSlug').value = '';
      document.getElementById('publishUrlPreview').textContent = location.origin + '/p/xxx';
      showModal('publishModal');
      document.getElementById('publishSlug').oninput = function(e) {
        var s = e.target.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
        document.getElementById('publishUrlPreview').textContent = location.origin + '/p/' + (s || 'xxx');
      };
    }
    function doPublish() {
      var slug = document.getElementById('publishSlug').value.trim().toLowerCase();
      var err = document.getElementById('publishError');
      err.textContent = '';
      if (!/^[a-z0-9-]{3,30}$/.test(slug)) {
        err.textContent = 'slug 只能包含小写字母、数字、短横线，长度 3-30';
        return;
      }
      saveProject();
      var html = generateFullHTML();
      fetch('/api/projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: currentProjectId, title: getProject().title, html: html })
      }).then(function() {
        return fetch('/api/projects/' + currentProjectId + '/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug: slug })
        });
      }).then(function(res) {
        return res.json().then(function(data) {
          if (!res.ok) throw new Error(data.error || '发布失败');
          hideModal('publishModal');
          showAlert('发布成功', location.origin + data.url);
        });
      }).catch(function(e) { err.textContent = e.message; });
    }

    function renderAll() {
      renderPagesBar();
      renderPalette();
      renderCanvas();
      renderProps();
      var btn = document.getElementById('btnPreviewMode');
      btn.textContent = '预览交互';
      btn.className = 'btn-secondary';
      document.getElementById('modeHint').textContent = '编辑模式 · 拖入组件';
    }


    var sheetCollapsed = false;
    var sheetMode = 'comps'; // comps | props

    function toggleSheet() {
      sheetCollapsed = !sheetCollapsed;
      var sheet = document.getElementById('bottomSheet');
      var btn = document.getElementById('btnSheet');
      var tbtn = document.getElementById('sheetToggleBtn');
      if (sheetCollapsed) {
        sheet.classList.add('collapsed');
        if (btn) btn.textContent = '展开面板';
        if (tbtn) tbtn.textContent = '展开';
      } else {
        sheet.classList.remove('collapsed');
        if (btn) btn.textContent = '收起面板';
        if (tbtn) tbtn.textContent = '收起';
      }
    }
    function showSheetComps() {
      sheetMode = 'comps';
      document.getElementById('sheetComps').style.display = '';
      document.getElementById('sheetProps').style.display = 'none';
      document.getElementById('sheetTitle').textContent = '添加组件';
      if (sheetCollapsed) toggleSheet();
    }
    function showSheetProps() {
      sheetMode = 'props';
      document.getElementById('sheetComps').style.display = 'none';
      document.getElementById('sheetProps').style.display = '';
      document.getElementById('sheetTitle').textContent = '属性 / 跳转';
      if (sheetCollapsed) { sheetCollapsed = false; document.getElementById('bottomSheet').classList.remove('collapsed');
        var btn = document.getElementById('btnSheet'); if (btn) btn.textContent = '收起面板';
        var tbtn = document.getElementById('sheetToggleBtn'); if (tbtn) tbtn.textContent = '收起';
      }
    }

    function init() {
      loadProjects();
      renderPalette();
      setupDrop();
      document.getElementById('phoneScreen').addEventListener('click', function(e) {
        if (previewMode) return;
        if (e.target.id === 'dropZone' || e.target.classList.contains('empty-hint') || e.target.id === 'phoneScreen') {
          selectedId = null;
          selectedSlot = null;
          renderCanvas();
          renderProps();
          showSheetComps();
        }
      });
      // Enter 确认创建
      document.getElementById('createTitle').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') confirmCreate();
      });
      document.getElementById('newPageName').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') confirmAddPage();
      });
      var handle = document.getElementById('sheetHandle');
      if (handle) handle.addEventListener('click', function(e) {
        if (e.target.closest && e.target.closest('.sheet-toggle')) {
          e.stopPropagation();
          toggleSheet();
          return;
        }
        toggleSheet();
      });
      // 半窗内容区：阻止拖动手势冒泡，保证可滑动
      ['paletteList','propsBody','sheetBody'].forEach(function(id) {
        var el = document.getElementById(id) || document.querySelector('.sheet-body');
        if (!el) return;
        el.addEventListener('touchstart', function(e){ e.stopPropagation(); }, { passive: true });
        el.addEventListener('touchmove', function(e){ e.stopPropagation(); }, { passive: true });
      });
      var sheetBody = document.querySelector('.sheet-body');
      if (sheetBody) {
        sheetBody.addEventListener('touchstart', function(e){ e.stopPropagation(); }, { passive: true });
        sheetBody.addEventListener('touchmove', function(e){ e.stopPropagation(); }, { passive: true });
      }
    }
    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DIY 手机网页搭建平台</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      transition: background .15s, opacity .15s;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input, select, textarea { font-family: inherit; }

    /* 首页 */
    #homeView {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: radial-gradient(ellipse at top, #1e293b 0%, #0f172a 70%);
      padding: 20px;
    }
    #homeView h1 { font-size: 26px; font-weight: 700; text-align: center; }
    #homeView .sub { color: var(--muted); font-size: 14px; text-align: center; margin-top: -12px; }
    .home-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .btn-home {
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #334155; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }

    /* 编辑器 */
    #editorView { display: none; height: 100vh; flex-direction: column; }
    #editorView.show { display: flex; }

    .topbar {
      height: 48px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      flex-shrink: 0;
      gap: 8px;
    }
    .topbar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .topbar-left h2 { font-size: 14px; font-weight: 600; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topbar-right { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .topbar button { padding: 6px 10px; font-size: 12px; }
    .status-text { font-size: 11px; color: var(--muted); }

    .editor-body { flex: 1; display: flex; overflow: hidden; }

    /* 左侧 */
    .palette {
      width: 220px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .palette-tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
    .palette-tab {
      flex: 1;
      min-width: 50%;
      padding: 8px 2px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      background: transparent;
      border-radius: 0;
    }
    .palette-tab:hover { color: var(--text); background: #334155; }
    .palette-tab.active { color: #60a5fa; border-bottom-color: var(--primary); }
    .palette-list { flex: 1; overflow-y: auto; padding: 10px; }
    .palette-hint { font-size: 10px; color: var(--muted); margin-bottom: 8px; line-height: 1.4; }
    .comp-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 6px;
      cursor: grab;
      user-select: none;
      transition: border-color .15s;
    }
    .comp-card:hover { border-color: var(--primary); }
    .comp-card .comp-preview {
      display: flex; align-items: center; justify-content: center;
      min-height: 28px; margin-bottom: 4px; color: #94a3b8; overflow: hidden;
    }
    .comp-card .comp-preview svg { width: 20px; height: 20px; }
    .comp-card .comp-name { font-size: 11px; text-align: center; color: var(--muted); }

    /* 页面标签 */
    .pages-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      background: #0f172a;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
    }
    .page-tab {
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      background: transparent;
      color: var(--muted);
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .page-tab.active { background: var(--primary); color: #fff; }
    .page-tab:hover:not(.active) { background: #334155; color: var(--text); }
    .page-add {
      padding: 5px 10px;
      font-size: 12px;
      background: transparent;
      color: #60a5fa;
      border: 1px dashed #334155;
      border-radius: 6px;
    }

    /* 画布 - 固定手机尺寸 */
    .canvas-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0b1220;
      overflow: hidden;
    }
    .canvas-toolbar {
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .canvas-toolbar span { font-size: 11px; color: var(--muted); }
    .canvas-scroll {
      flex: 1;
      overflow: auto;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    /* 手机外框 */
    .phone-frame {
      width: 375px;
      flex-shrink: 0;
      background: #1a1a1a;
      border-radius: 36px;
      padding: 12px;
      box-shadow: 0 12px 48px rgba(0,0,0,.5), inset 0 0 0 2px #333;
    }
    .phone-notch {
      width: 120px;
      height: 28px;
      background: #1a1a1a;
      border-radius: 0 0 16px 16px;
      margin: -4px auto 8px;
      position: relative;
      z-index: 2;
    }
    .phone-screen {
      width: 100%;
      height: 667px;
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
    }
    .phone-screen.preview-mode { cursor: default; }
    .canvas-drop-zone {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      border: 2px dashed transparent;
      transition: border-color .15s, background .15s;
      -webkit-overflow-scrolling: touch;
    }
    .canvas-drop-zone.drag-over {
      border-color: var(--primary);
      background: rgba(59,130,246,.06);
    }
    .empty-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #94a3b8;
      font-size: 13px;
      gap: 6px;
      pointer-events: none;
    }

    .canvas-el {
      position: relative;
      outline: 2px solid transparent;
      outline-offset: -2px;
      transition: outline-color .1s;
      cursor: pointer;
    }
    .canvas-el:hover { outline-color: rgba(59,130,246,.35); }
    .canvas-el.selected { outline-color: var(--primary); }
    .canvas-el .el-actions {
      position: absolute;
      top: 2px;
      right: 2px;
      display: none;
      gap: 3px;
      z-index: 10;
    }
    .canvas-el.selected .el-actions { display: flex; }
    .el-actions button {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      background: #1e293b;
      color: #fff;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .el-actions button:hover { background: #334155; }
    .el-actions .btn-del:hover { background: var(--danger); }
    .link-badge {
      position: absolute;
      bottom: 2px;
      left: 2px;
      background: rgba(59,130,246,.9);
      color: #fff;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 4px;
      display: none;
      z-index: 5;
    }
    .canvas-el.selected .link-badge,
    .canvas-el:hover .link-badge { display: block; }

    /* 右侧属性 */
    .props-panel {
      width: 260px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    .props-header {
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
    }
    .props-body { flex: 1; overflow-y: auto; padding: 14px; }
    .prop-group { margin-bottom: 14px; }
    .prop-group label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .prop-group input[type="text"],
    .prop-group input[type="number"],
    .prop-group select {
      width: 100%;
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 12px;
      outline: none;
    }
    .prop-group input:focus, .prop-group select:focus { border-color: var(--primary); }
    .color-row { display: flex; gap: 6px; align-items: center; }
    .color-row input[type="color"] {
      width: 36px; height: 32px;
      border: none; border-radius: 6px;
      cursor: pointer; background: transparent; padding: 0;
    }
    .color-presets { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .color-swatch {
      width: 24px; height: 24px;
      border-radius: 5px; cursor: pointer;
      border: 2px solid transparent;
    }
    .color-swatch:hover { border-color: #fff; }
    .props-empty {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 36px 12px;
      line-height: 1.6;
    }
    .size-row { display: flex; gap: 8px; }
    .size-row > div { flex: 1; }

    /* 自定义弹窗 */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-mask.show { display: flex; }
    .modal {
      background: var(--panel);
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      overflow: hidden;
      animation: modalIn .2s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 { font-size: 16px; }
    .modal-close {
      width: 30px; height: 30px;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
    }
    .modal-close:hover { background: #334155; color: #fff; }
    .modal-body { flex: 1; overflow-y: auto; padding: 16px 18px; }
    .modal-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .modal-footer button { padding: 8px 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus { border-color: var(--primary); }
    .modal-msg { font-size: 14px; line-height: 1.6; color: var(--text); }

    .project-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s;
    }
    .project-item:hover { background: #334155; }
    .project-item .info { flex: 1; min-width: 0; }
    .project-item .title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-item .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .project-item .del-btn {
      width: 30px; height: 30px;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      flex-shrink: 0;
    }
    .project-item .del-btn:hover { background: var(--danger); color: #fff; }
    .empty-projects { text-align: center; padding: 40px 16px; color: var(--muted); font-size: 13px; }

    .url-preview {
      background: #0f172a;
      padding: 10px 12px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      border: 1px solid var(--border);
      margin-top: 8px;
    }
    .error-text { color: #f87171; font-size: 13px; margin-top: 8px; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #16a34a;
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 2000;
      opacity: 0;
      transition: all .25s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 预览时手机内交互 */
    .preview-search-input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 14px;
      color: #111;
    }

    @media (max-width: 900px) {
      .palette { width: 180px; }
      .props-panel { width: 200px; }
      .phone-frame { transform: scale(0.85); transform-origin: top center; }
    }
  </style>
</head>
<body>

  <div id="homeView">
    <h1>DIY 手机网页搭建平台</h1>
    <p class="sub">拖拽组件 · 多页面跳转 · 真实可交互</p>
    <div class="home-actions">
      <button class="btn-home btn-primary" onclick="openCreateModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建项目
      </button>
      <button class="btn-home btn-secondary" onclick="showProjectsModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        我的项目
      </button>
    </div>
  </div>

  <div id="editorView">
    <div class="topbar">
      <div class="topbar-left">
        <button class="btn-secondary" style="padding:5px 10px;" onclick="backToHome()">← 返回</button>
        <h2 id="editorTitle">未命名</h2>
      </div>
      <div class="topbar-right">
        <span class="status-text" id="saveStatus"></span>
        <button class="btn-secondary" id="btnPreviewMode" onclick="togglePreviewMode()">预览交互</button>
        <button class="btn-primary" onclick="saveProject()">保存</button>
        <button class="btn-success" onclick="exportHTML()">导出</button>
        <button class="btn-secondary" onclick="showPublishModal()">发布</button>
      </div>
    </div>

    <div class="pages-bar" id="pagesBar"></div>

    <div class="editor-body">
      <div class="palette">
        <div class="palette-tabs" id="paletteTabs"></div>
        <div class="palette-list" id="paletteList"></div>
      </div>

      <div class="canvas-wrap">
        <div class="canvas-toolbar">
          <span id="modeHint">编辑模式 · 拖入组件</span>
          <button class="btn-secondary" style="padding:4px 8px;font-size:11px;" onclick="openClearModal()">清空本页</button>
        </div>
        <div class="canvas-scroll">
          <div class="phone-frame">
            <div class="phone-notch"></div>
            <div class="phone-screen" id="phoneScreen">
              <div class="canvas-drop-zone" id="dropZone"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="props-panel">
        <div class="props-header">属性 / 跳转设置</div>
        <div class="props-body" id="propsBody">
          <div class="props-empty">选中组件后<br>可改颜色、大小、跳转页面</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 新建项目弹窗 -->
  <div class="modal-mask" id="createModal">
    <div class="modal">
      <div class="modal-header">
        <h3>新建项目</h3>
        <button class="modal-close" onclick="hideModal('createModal')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>项目名称</label>
          <input type="text" id="createTitle" placeholder="例如：我的商城" maxlength="50">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="hideModal('createModal')">取消</button>
        <button class="btn-primary" onclick="confirmCreate()">创建</button>
      </div>
    </div>
  </div>

  <!-- 通用确认弹窗 -->
  <div class="modal-mask" id="confirmModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="confirmTitle">确认</h3>
        <button class="modal-close" onclick="hideModal('confirmModal')">×</button>
      </div>
      <div class="modal-body">
        <p class="modal-msg" id="confirmMsg"></p>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="hideModal('confirmModal')">取消</button>
        <button class="btn-danger" id="confirmOkBtn">确定</button>
      </div>
    </div>
  </div>

  <!-- 提示弹窗 -->
  <div class="modal-mask" id="alertModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="alertTitle">提示</h3>
        <button class="modal-close" onclick="hideModal('alertModal')">×</button>
      </div>
      <div class="modal-body">
        <p class="modal-msg" id="alertMsg"></p>
      </div>
      <div class="modal-footer">
        <button class="btn-primary" onclick="hideModal('alertModal')">知道了</button>
      </div>
    </div>
  </div>

  <!-- 项目列表 -->
  <div class="modal-mask" id="projectsModal">
    <div class="modal">
      <div class="modal-header">
        <h3>我的项目</h3>
        <button class="modal-close" onclick="hideModal('projectsModal')">×</button>
      </div>
      <div class="modal-body" id="projectsList"></div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="hideModal('projectsModal')">关闭</button>
        <button class="btn-primary" onclick="hideModal('projectsModal'); openCreateModal();">新建</button>
      </div>
    </div>
  </div>

  <!-- 新建页面 -->
  <div class="modal-mask" id="newPageModal">
    <div class="modal">
      <div class="modal-header">
        <h3>新建页面</h3>
        <button class="modal-close" onclick="hideModal('newPageModal')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>页面名称</label>
          <input type="text" id="newPageName" placeholder="例如：分类页、商品详情" maxlength="30">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="hideModal('newPageModal')">取消</button>
        <button class="btn-primary" onclick="confirmAddPage()">创建</button>
      </div>
    </div>
  </div>

  <!-- 发布 -->
  <div class="modal-mask" id="publishModal">
    <div class="modal">
      <div class="modal-header">
        <h3>发布网页</h3>
        <button class="modal-close" onclick="hideModal('publishModal')">×</button>
      </div>
      <div class="modal-body">
        <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">设置访问地址，别人可通过链接打开</p>
        <div class="form-group">
          <label>访问地址（slug）</label>
          <input type="text" id="publishSlug" placeholder="例如：my-shop">
          <div class="url-preview" id="publishUrlPreview">/p/xxx</div>
        </div>
        <div class="error-text" id="publishError"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="hideModal('publishModal')">取消</button>
        <button class="btn-success" onclick="doPublish()">确认发布</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ========== 图标 ==========
    var ICONS = {
      cart: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>',

    function uid(prefix) { return (prefix||'el') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function(){ t.classList.remove('show'); }, 2000);
    }
    function getDef(type) {
      for (var i=0;i<COMPONENT_DEFS.length;i++) if (COMPONENT_DEFS[i].type===type) return COMPONENT_DEFS[i];
      return null;
    }
    function getProject() { return projects[currentProjectId] || null; }
    function getPage() {
      var p = getProject();
      if (!p || !p.pages) return null;
      for (var i=0;i<p.pages.length;i++) if (p.pages[i].id===currentPageId) return p.pages[i];
      return p.pages[0] || null;
    }
    function getElements() {
      var page = getPage();
      return page ? page.elements : [];
    }
    function setElements(els) {
      var page = getPage();
      if (page) page.elements = els;
    }

    // ========== 弹窗 ==========
    function showModal(id) { document.getElementById(id).classList.add('show'); }
    function hideModal(id) { document.getElementById(id).classList.remove('show'); }

    function openCreateModal() {
      document.getElementById('createTitle').value = '';
      showModal('createModal');
      setTimeout(function(){ document.getElementById('createTitle').focus(); }, 100);
    }
    function confirmCreate() {
      var title = document.getElementById('createTitle').value.trim() || '未命名项目';
      hideModal('createModal');
      var id = uid('p');
      var pageId = uid('page');
      currentProjectId = id;
      currentPageId = pageId;
      selectedId = null;
      previewMode = false;
      projects[id] = {
        id: id,
        title: title,
        pages: [{ id: pageId, name: '首页', elements: [] }],
        updated_at: new Date().toISOString(),
        created_at: new Date().toISOString()
      };
      persist();
      document.getElementById('editorTitle').textContent = title;
      document.getElementById('saveStatus').textContent = '';
      showEditor();
      renderAll();
      toast('已创建，开始搭建');
    }

    function showConfirm(title, msg, onOk) {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMsg').textContent = msg;
      confirmCallback = onOk;
      document.getElementById('confirmOkBtn').onclick = function() {
        hideModal('confirmModal');
        if (confirmCallback) confirmCallback();
        confirmCallback = null;
      };
      showModal('confirmModal');
    }
    function showAlert(title, msg) {
      document.getElementById('alertTitle').textContent = title || '提示';
      document.getElementById('alertMsg').textContent = msg;
      showModal('alertModal');
    }

    function openClearModal() {
      showConfirm('清空本页', '确定清空当前页面的所有组件？', function() {
        setElements([]);
        selectedId = null;
        renderCanvas();
        renderProps();
      });
    }

    // ========== 存储 ==========
    function loadProjects() {
      try { projects = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { projects = {}; }
    }
    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
    }

    // ========== 导航 ==========
    function showHome() {
      document.getElementById('homeView').style.display = 'flex';
      document.getElementById('editorView').classList.remove('show');
      previewMode = false;
    }
    function showEditor() {
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('editorView').classList.add('show');
    }
    function backToHome() {
      if (getElements().length) {
        showConfirm('返回首页', '未保存的修改可能丢失，确定返回？', function(){ showHome(); });
      } else {
        showHome();
      }
    }

    function openProject(id) {
      var p = projects[id];
      if (!p) return;
      // 兼容旧数据
      if (!p.pages) {
        p.pages = [{ id: uid('page'), name: '首页', elements: p.elements || [] }];
        delete p.elements;
      }
      currentProjectId = id;
      currentPageId = p.pages[0].id;
      selectedId = null;
      previewMode = false;
      document.getElementById('editorTitle').textContent = p.title;
      hideModal('projectsModal');
      showEditor();
      renderAll();
      toast('已打开：' + p.title);
    }

    function saveProject() {
      if (!currentProjectId) return;
      var p = getProject();
      p.updated_at = new Date().toISOString();
      persist();
      document.getElementById('saveStatus').textContent = '已保存';
      toast('已保存');
      var html = generateFullHTML();
      fetch('/api/projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: currentProjectId, title: p.title, html: html })
      }).catch(function(){});
    }

    function deleteProject(id, e) {
      e.stopPropagation();
      showConfirm('删除项目', '确定删除该项目？此操作不可恢复。', function() {
        delete projects[id];
        persist();
        renderProjectsList();
        if (currentProjectId === id) { currentProjectId = null; showHome(); }
        toast('已删除');
      });
    }

    function showProjectsModal() {
      loadProjects();
      renderProjectsList();
      showModal('projectsModal');
    }
    function renderProjectsList() {
      var list = Object.keys(projects).map(function(k){ return projects[k]; })
        .sort(function(a,b){ return new Date(b.updated_at)-new Date(a.updated_at); });
      var el = document.getElementById('projectsList');
      if (!list.length) {
        el.innerHTML = '<div class="empty-projects">暂无项目</div>';
        return;
      }
      el.innerHTML = list.map(function(p) {
        var pageCount = (p.pages && p.pages.length) || 1;
        var elCount = 0;
        if (p.pages) p.pages.forEach(function(pg){ elCount += (pg.elements||[]).length; });
        else elCount = (p.elements||[]).length;
        return '<div class="project-item" onclick="openProject(\''+p.id+'\')">'+
          '<div class="info"><div class="title">'+esc(p.title)+'</div>'+
          '<div class="meta">'+pageCount+' 页 · '+elCount+' 组件 · '+new Date(p.updated_at).toLocaleString()+'</div></div>'+
          '<button class="del-btn" onclick="deleteProject(\''+p.id+'\',event)">🗑</button></div>';
      }).join('');
    }

    // ========== 多页面 ==========
    function renderPagesBar() {
      var p = getProject();
      var bar = document.getElementById('pagesBar');
      if (!p || !p.pages) { bar.innerHTML = ''; return; }
      bar.innerHTML = p.pages.map(function(pg) {
        return '<button class="page-tab '+(pg.id===currentPageId?'active':'')+'" onclick="switchPage(\''+pg.id+'\')">'+esc(pg.name)+'</button>';
      }).join('') +
        '<button class="page-add" onclick="openNewPageModal()">+ 新页面</button>';
    }
    function switchPage(pageId) {
      currentPageId = pageId;
      selectedId = null;
      searchFilter = '';
      renderPagesBar();
      renderCanvas();
      renderProps();
    }
    function openNewPageModal() {
      document.getElementById('newPageName').value = '';
      showModal('newPageModal');
      setTimeout(function(){ document.getElementById('newPageName').focus(); }, 100);
    }
    function confirmAddPage() {
      var name = document.getElementById('newPageName').value.trim() || '新页面';
      hideModal('newPageModal');
      var p = getProject();
      var pageId = uid('page');
      p.pages.push({ id: pageId, name: name, elements: [] });
      currentPageId = pageId;
      selectedId = null;
      persist();
      renderPagesBar();
      renderCanvas();
      renderProps();
      toast('已添加页面：' + name);
    }

    // ========== 组件库 ==========
    function renderPalette() {
      var tabs = document.getElementById('paletteTabs');
      tabs.innerHTML = CATEGORIES.map(function(c) {
        return '<button class="palette-tab '+(c.id===currentTab?'active':'')+'" onclick="switchTab(\''+c.id+'\')">'+c.label+'</button>';
      }).join('');
      var list = document.getElementById('paletteList');
      var comps = COMPONENT_DEFS.filter(function(d){ return d.category===currentTab; });
      list.innerHTML = '<div class="palette-hint">拖到手机画布，或点击添加</div>' +
        comps.map(function(d) {
          return '<div class="comp-card" draggable="true" ondragstart="onDragStart(event,\''+d.type+'\')" onclick="addComponent(\''+d.type+'\')">'+
            '<div class="comp-preview">'+d.render(d.defaults, {preview:false})+'</div>'+
            '<div class="comp-name">'+esc(d.name)+'</div></div>';
        }).join('');
    }
    function switchTab(id) { currentTab = id; renderPalette(); }

    function addComponent(type) {
      if (previewMode) { toast('请先退出预览模式'); return; }
      var def = getDef(type);
      if (!def) return;
      var els = getElements();
      var el = { id: uid('el'), type: type, props: Object.assign({}, def.defaults) };
      els.push(el);
      setElements(els);
      selectedId = el.id;
      renderCanvas();
      renderProps();
      toast('已添加');
    }
    function onDragStart(e, type) {
      dragType = type;
      e.dataTransfer.setData('text/plain', type);
      e.dataTransfer.effectAllowed = 'copy';
    }
    function setupDrop() {
      var zone = document.getElementById('dropZone');
      var screen = document.getElementById('phoneScreen');
      screen.addEventListener('dragover', function(e){ e.preventDefault(); if(!previewMode) zone.classList.add('drag-over'); });
      screen.addEventListener('dragleave', function(e){ if (!screen.contains(e.relatedTarget)) zone.classList.remove('drag-over'); });
      screen.addEventListener('drop', function(e){
        e.preventDefault();
        zone.classList.remove('drag-over');
        if (previewMode) return;
        var type = e.dataTransfer.getData('text/plain') || dragType;
        if (type) addComponent(type);
        dragType = null;
      });
    }

    // ========== 画布渲染 ==========
    function renderCanvas() {
      var zone = document.getElementById('dropZone');
      var els = getElements();
      var ctx = { preview: previewMode };

      // 搜索过滤（仅预览）
      var filtered = els;
      if (previewMode && searchFilter) {
        filtered = els.filter(function(el) {
          if (el.type !== 'product-card' && el.type !== 'product-list') return true;
          var name = (el.props.name || '').toLowerCase();
          return name.indexOf(searchFilter.toLowerCase()) >= 0;
        });
        // 始终显示非商品组件
        filtered = els.filter(function(el) {
          if (el.type === 'product-card' || el.type === 'product-list') {
            var name = (el.props.name || '').toLowerCase();
            return !searchFilter || name.indexOf(searchFilter.toLowerCase()) >= 0;
          }
          return true;
        });
      }

      if (!els.length) {
        zone.innerHTML = '<div class="empty-hint"><div style="font-size:28px;opacity:.35;">↓</div><div>拖入组件到这里</div></div>';
        return;
      }

      if (previewMode) {
        zone.innerHTML = filtered.map(function(el) {
          var def = getDef(el.type);
          if (!def) return '';
          return '<div class="canvas-el" data-id="'+el.id+'">'+def.render(el.props, ctx)+'</div>';
        }).join('');
        bindPreviewEvents(zone);
      } else {
        zone.innerHTML = els.map(function(el) {
          var def = getDef(el.type);
          if (!def) return '';
          var linkLabel = getLinkLabel(el);
          return '<div class="canvas-el '+(el.id===selectedId?'selected':'')+'" data-id="'+el.id+'" onclick="selectEl(\''+el.id+'\',event)">'+
            '<div class="el-actions">'+
              '<button onclick="moveEl(\''+el.id+'\',-1,event)">↑</button>'+
              '<button onclick="moveEl(\''+el.id+'\',1,event)">↓</button>'+
              '<button class="btn-del" onclick="removeEl(\''+el.id+'\',event)">×</button>'+
            '</div>'+
            (linkLabel ? '<span class="link-badge">→ '+esc(linkLabel)+'</span>' : '')+
            def.render(el.props, ctx)+'</div>';
        }).join('');
      }
    }

    function getLinkLabel(el) {
      var p = el.props;
      var ids = [p.linkPageId, p.menu1Page, p.menu2Page, p.cartPage, p.page1, p.page2, p.page3, p.page4, p.backPage, p.morePage];
      var proj = getProject();
      if (!proj) return '';
      for (var i=0;i<ids.length;i++) {
        if (ids[i]) {
          for (var j=0;j<proj.pages.length;j++) {
            if (proj.pages[j].id === ids[i]) return proj.pages[j].name;
          }
        }
      }
      return '';
    }

    function bindPreviewEvents(zone) {
      // 搜索
      var inputs = zone.querySelectorAll('[data-role="search"]');
      for (var i=0;i<inputs.length;i++) {
        inputs[i].addEventListener('input', function(e) {
          searchFilter = e.target.value;
          renderCanvas();
          // 恢复焦点与内容
          var again = document.querySelector('[data-role="search"]');
          if (again) { again.value = searchFilter; again.focus(); }
        });
      }
      // 跳转
      zone.addEventListener('click', function(e) {
        var target = e.target.closest('[data-page]');
        if (!target) target = e.target.closest('[data-role="tap"],[data-role="link"]');
        if (!target) return;
        var pageId = target.getAttribute('data-page');
        if (pageId) {
          e.preventDefault();
          e.stopPropagation();
          navigateToPage(pageId);
        }
      });
    }

    function navigateToPage(pageId) {
      var p = getProject();
      if (!p) return;
      var found = false;
      for (var i=0;i<p.pages.length;i++) {
        if (p.pages[i].id === pageId) { found = true; break; }
      }
      if (!found) {
        toast('未设置跳转页面');
        return;
      }
      searchFilter = '';
      currentPageId = pageId;
      renderPagesBar();
      renderCanvas();
      toast('进入：' + (function(){
        for (var i=0;i<p.pages.length;i++) if (p.pages[i].id===pageId) return p.pages[i].name;
        return '';
      })());
    }

    function selectEl(id, e) {
      if (previewMode) return;
      if (e) e.stopPropagation();
      selectedId = id;
      renderCanvas();
      renderProps();
    }
    function removeEl(id, e) {
      e.stopPropagation();
      var els = getElements().filter(function(el){ return el.id !== id; });
      setElements(els);
      if (selectedId === id) selectedId = null;
      renderCanvas();
      renderProps();
    }
    function moveEl(id, dir, e) {
      e.stopPropagation();
      var els = getElements().slice();
      var idx = -1;
      for (var i=0;i<els.length;i++) if (els[i].id===id) { idx=i; break; }
      if (idx < 0) return;
      var ni = idx + dir;
      if (ni < 0 || ni >= els.length) return;
      var t = els[idx]; els[idx] = els[ni]; els[ni] = t;
      setElements(els);
      renderCanvas();
    }

    // ========== 属性面板 ==========
    function renderProps() {
      var body = document.getElementById('propsBody');
      if (previewMode) {
        body.innerHTML = '<div class="props-empty">预览模式中<br>点击组件可跳转页面<br>搜索框可实时筛选商品</div>';
        return;
      }
      var els = getElements();
      var el = null;
      for (var i=0;i<els.length;i++) if (els[i].id===selectedId) { el=els[i]; break; }
      if (!el) {
        body.innerHTML = '<div class="props-empty">选中组件后<br>可改颜色、大小、跳转页面</div>';
        return;
      }
      var def = getDef(el.type);
      var props = el.props;
      var html = '<div style="font-size:12px;font-weight:600;margin-bottom:12px;color:#e2e8f0;">'+esc(def.name)+'</div>';

      // 跳转页面选择（通用）
      var pageLinkKeys = getPageLinkKeys(el.type);
      var proj = getProject();
      var pageOptions = '<option value="">不跳转</option>';
      if (proj && proj.pages) {
        proj.pages.forEach(function(pg) {
          pageOptions += '<option value="'+pg.id+'">'+esc(pg.name)+'</option>';
        });
      }

      var keys = Object.keys(props);
      for (var k=0;k<keys.length;k++) {
        var key = keys[k];
        var val = props[key];
        var isColor = /color|Color|bgColor|textColor|borderColor|priceColor|btnColor|activeColor|inactiveColor/i.test(key);
        var isPage = pageLinkKeys.indexOf(key) >= 0 || key === 'linkPageId';
        var isSize = /size|height|radius|imgHeight|imgSize|fontSize|padding/i.test(key);
        var label = propLabel(key);

        if (isPage) {
          html += '<div class="prop-group"><label>'+label+'</label><select onchange="updateProp(\''+key+'\', this.value)">';
          if (proj && proj.pages) {
            html += '<option value="">不跳转</option>';
            proj.pages.forEach(function(pg) {
              html += '<option value="'+pg.id+'" '+(val===pg.id?'selected':'')+'>'+esc(pg.name)+'</option>';
            });
          }
          html += '</select></div>';
        } else if (isColor) {
          html += '<div class="prop-group"><label>'+label+'</label><div class="color-row">'+
            '<input type="color" value="'+toHex(val)+'" oninput="updateProp(\''+key+'\', this.value)">'+
            '<input type="text" value="'+esc(val)+'" onchange="updateProp(\''+key+'\', this.value)" style="flex:1;"></div>'+
            '<div class="color-presets">'+COLOR_PRESETS.map(function(c){
              return '<div class="color-swatch" style="background:'+c+';'+(c==='#ffffff'?'border:1px solid #ccc;':'')+'" onclick="updateProp(\''+key+'\',\''+c+'\')"></div>';
            }).join('')+'</div></div>';
        } else if (isSize || typeof val === 'number') {
          html += '<div class="prop-group"><label>'+label+'</label><input type="number" min="0" value="'+val+'" onchange="updateProp(\''+key+'\', +this.value||0)"></div>';
        } else {
          html += '<div class="prop-group"><label>'+label+'</label><input type="text" value="'+esc(val)+'" onchange="updateProp(\''+key+'\', this.value)" placeholder="留空则不显示"></div>';
        }
      }
      body.innerHTML = html;
    }

    function getPageLinkKeys(type) {
      var map = {
        'nav-top': ['menu1Page','menu2Page','cartPage'],
        'nav-bottom': ['page1','page2','page3','page4'],
        'nav-back': ['backPage'],
        'section-title': ['morePage'],
        'btn-primary': ['linkPageId'],
        'btn-cart': ['linkPageId'],
        'btn-outline': ['linkPageId'],
        'banner': ['linkPageId'],
        'product-card': ['linkPageId'],
        'product-list': ['linkPageId'],
        'icon-cart': ['linkPageId'],
        'icon-heart': ['linkPageId'],
        'icon-search': ['linkPageId'],
        'icon-user': ['linkPageId'],
        'icon-home': ['linkPageId'],
        'icon-grid': ['linkPageId'],
      };
      return map[type] || ['linkPageId'];
    }

    function propLabel(key) {
      var map = {
        color:'颜色', size:'图标大小', bgColor:'背景色', textColor:'文字颜色',
        logoText:'Logo', menu1:'菜单1', menu2:'菜单2',
        menu1Page:'菜单1跳转', menu2Page:'菜单2跳转', cartPage:'购物车跳转',
        text:'按钮文字', radius:'圆角', borderColor:'边框色', height:'高度',
        title:'标题', subtitle:'副标题', bgColor1:'渐变色1', bgColor2:'渐变色2',
        placeholder:'占位提示', name:'商品名称', price:'价格', originPrice:'原价',
        sales:'销量文案', priceColor:'价格颜色', btnColor:'按钮颜色', btnText:'按钮文字',
        imgHeight:'图片高度', imgSize:'图片尺寸', linkPageId:'点击跳转页面',
        tab1:'Tab1', tab2:'Tab2', tab3:'Tab3', tab4:'Tab4',
        page1:'Tab1跳转', page2:'Tab2跳转', page3:'Tab3跳转', page4:'Tab4跳转',
        activeColor:'选中色', inactiveColor:'未选中色', backPage:'返回跳转',
        moreText:'更多文字', morePage:'更多跳转', fontSize:'字号', align:'对齐', padding:'内边距'
      };
      return map[key] || key;
    }
    function toHex(c) {
      if (!c) return '#000000';
      if (c.indexOf('#')===0 && c.length===7) return c;
      return '#3b82f6';
    }
    function updateProp(key, value) {
      var els = getElements();
      for (var i=0;i<els.length;i++) {
        if (els[i].id === selectedId) {
          els[i].props[key] = value;
          break;
        }
      }
      renderCanvas();
      if (/color|Color|Page|linkPage/i.test(key)) renderProps();
    }

    // ========== 预览模式 ==========
    function togglePreviewMode() {
      previewMode = !previewMode;
      selectedId = null;
      searchFilter = '';
      var btn = document.getElementById('btnPreviewMode');
      var hint = document.getElementById('modeHint');
      if (previewMode) {
        btn.textContent = '退出预览';
        btn.className = 'btn-primary';
        hint.textContent = '预览模式 · 点击可跳转 · 搜索可筛选';
        document.getElementById('phoneScreen').classList.add('preview-mode');
      } else {
        btn.textContent = '预览交互';
        btn.className = 'btn-secondary';
        hint.textContent = '编辑模式 · 拖入组件';
        document.getElementById('phoneScreen').classList.remove('preview-mode');
      }
      renderCanvas();
      renderProps();
    }

    // ========== 导出 ==========
    function generateFullHTML() {
      var proj = getProject();
      if (!proj) return '';
      var title = proj.title || '我的页面';
      // 导出时生成带简单 JS 的多页 HTML
      var pagesData = proj.pages.map(function(pg) {
        var body = (pg.elements||[]).map(function(el) {
          var def = getDef(el.type);
          return def ? def.render(el.props, { preview: true }) : '';
        }).join('\n');
        return { id: pg.id, name: pg.name, html: body };
      });

      var pagesJson = JSON.stringify(pagesData.map(function(p){ return { id: p.id, name: p.name }; }));
      var pagesHtml = pagesData.map(function(p, i) {
        return '<div class="page" id="page_'+p.id+'" style="'+(i===0?'':'display:none;')+'">'+p.html+'</div>';
      }).join('\n');

      return '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">\n<title>'+esc(title)+'</title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box;}\nbody{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#111;max-width:430px;margin:0 auto;min-height:100vh;}\n.preview-search-input{flex:1;border:none;background:transparent;outline:none;font-size:14px;color:#111;}\n</style>\n</head>\n<body>\n'+pagesHtml+'\n<script>\n'+
        'var pages='+pagesJson+';\n'+
        'function goPage(id){\n'+
        '  if(!id)return;\n'+
        '  document.querySelectorAll(".page").forEach(function(el){el.style.display="none";});\n'+
        '  var t=document.getElementById("page_"+id);\n'+
        '  if(t)t.style.display="block";\n'+
        '  window.scrollTo(0,0);\n'+
        '}\n'+
        'document.body.addEventListener("click",function(e){\n'+
        '  var t=e.target.closest("[data-page]");\n'+
        '  if(t){var id=t.getAttribute("data-page");if(id){e.preventDefault();goPage(id);}}\n'+
        '});\n'+
        'document.body.addEventListener("input",function(e){\n'+
        '  if(e.target.getAttribute("data-role")==="search"){\n'+
        '    var q=e.target.value.toLowerCase();\n'+
        '    var page=e.target.closest(".page");\n'+
        '    if(!page)return;\n'+
        '    page.querySelectorAll("[data-product]").forEach(function(el){\n'+
        '      var name=(el.getAttribute("data-product")||"").toLowerCase();\n'+
        '      el.style.display=(!q||name.indexOf(q)>=0)?"":"none";\n'+
        '    });\n'+
        '  }\n'+
        '});\n'+
        '<\/script>\n</body>\n</html>';
    }

    function exportHTML() {
      var proj = getProject();
      if (!proj) return;
      var hasContent = false;
      proj.pages.forEach(function(pg){ if (pg.elements && pg.elements.length) hasContent = true; });
      if (!hasContent) { showAlert('提示', '画布为空，请先添加组件'); return; }
      var html = generateFullHTML();
      var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (proj.title || 'page').replace(/[\\/:*?"<>|]/g, '_') + '.html';
      a.click();
      URL.revokeObjectURL(a.href);
      toast('已导出（含多页跳转与搜索）');
    }

    function showPublishModal() {
      if (!currentProjectId) { showAlert('提示', '请先保存项目'); return; }
      document.getElementById('publishError').textContent = '';
      document.getElementById('publishSlug').value = '';
      document.getElementById('publishUrlPreview').textContent = location.origin + '/p/xxx';
      showModal('publishModal');
      document.getElementById('publishSlug').oninput = function(e) {
        var s = e.target.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
        document.getElementById('publishUrlPreview').textContent = location.origin + '/p/' + (s || 'xxx');
      };
    }
    function doPublish() {
      var slug = document.getElementById('publishSlug').value.trim().toLowerCase();
      var err = document.getElementById('publishError');
      err.textContent = '';
      if (!/^[a-z0-9-]{3,30}$/.test(slug)) {
        err.textContent = 'slug 只能包含小写字母、数字、短横线，长度 3-30';
        return;
      }
      saveProject();
      var html = generateFullHTML();
      fetch('/api/projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: currentProjectId, title: getProject().title, html: html })
      }).then(function() {
        return fetch('/api/projects/' + currentProjectId + '/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug: slug })
        });
      }).then(function(res) {
        return res.json().then(function(data) {
          if (!res.ok) throw new Error(data.error || '发布失败');
          hideModal('publishModal');
          showAlert('发布成功', location.origin + data.url);
        });
      }).catch(function(e) { err.textContent = e.message; });
    }

    function renderAll() {
      renderPagesBar();
      renderPalette();
      renderCanvas();
      renderProps();
      var btn = document.getElementById('btnPreviewMode');
      btn.textContent = '预览交互';
      btn.className = 'btn-secondary';
      document.getElementById('modeHint').textContent = '编辑模式 · 拖入组件';
    }

    function init() {
      loadProjects();
      renderPalette();
      setupDrop();
      document.getElementById('phoneScreen').addEventListener('click', function(e) {
        if (previewMode) return;
        if (e.target.id === 'dropZone' || e.target.classList.contains('empty-hint') || e.target.id === 'phoneScreen') {
          selectedId = null;
          renderCanvas();
          renderProps();
        }
      });
      // Enter 确认创建
      document.getElementById('createTitle').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') confirmCreate();
      });
      document.getElementById('newPageName').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') confirmAddPage();
      });
    }
    init();
  </script>
</body>
</html>

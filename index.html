<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIY 电商网页搭建平台</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      transition: background .15s, opacity .15s;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input, select, textarea { font-family: inherit; }

    #homeView {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: radial-gradient(ellipse at top, #1e293b 0%, #0f172a 70%);
    }
    #homeView h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    #homeView .sub { color: var(--muted); font-size: 15px; margin-top: -16px; }
    .home-actions { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .btn-home {
      padding: 16px 36px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #334155; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }

    #editorView { display: none; height: 100vh; flex-direction: column; }
    #editorView.show { display: flex; }

    .topbar {
      height: 52px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      gap: 12px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-left h2 { font-size: 15px; font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topbar-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .topbar button { padding: 7px 14px; }
    .status-text { font-size: 12px; color: var(--muted); }

    .editor-body { flex: 1; display: flex; overflow: hidden; }

    .palette {
      width: 260px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .palette-tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
    .palette-tab {
      flex: 1;
      min-width: 50%;
      padding: 10px 4px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      background: transparent;
      border-radius: 0;
    }
    .palette-tab:hover { color: var(--text); background: #334155; }
    .palette-tab.active { color: #60a5fa; border-bottom-color: var(--primary); }
    .palette-list { flex: 1; overflow-y: auto; padding: 12px; }
    .palette-hint { font-size: 11px; color: var(--muted); margin-bottom: 10px; line-height: 1.4; }
    .comp-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: grab;
      transition: border-color .15s, transform .1s;
      user-select: none;
    }
    .comp-card:hover { border-color: var(--primary); }
    .comp-card:active { cursor: grabbing; transform: scale(0.98); }
    .comp-card .comp-preview {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      margin-bottom: 6px;
      color: #94a3b8;
      overflow: hidden;
    }
    .comp-card .comp-preview svg { width: 24px; height: 24px; }
    .comp-card .comp-name { font-size: 12px; text-align: center; color: var(--muted); }

    .canvas-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0b1220;
      overflow: hidden;
    }
    .canvas-toolbar {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-shrink: 0;
    }
    .canvas-toolbar span { font-size: 12px; color: var(--muted); }
    .canvas-scroll {
      flex: 1;
      overflow: auto;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .canvas {
      width: 100%;
      max-width: 420px;
      min-height: 700px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,.35);
      overflow: hidden;
      position: relative;
    }
    .canvas.phone { max-width: 390px; min-height: 780px; }
    .canvas.empty-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 400px;
      color: #94a3b8;
      font-size: 14px;
      gap: 8px;
      pointer-events: none;
    }
    .canvas-drop-zone {
      min-height: 60px;
      border: 2px dashed transparent;
      transition: border-color .15s, background .15s;
    }
    .canvas-drop-zone.drag-over {
      border-color: var(--primary);
      background: rgba(59,130,246,.08);
    }

    .canvas-el {
      position: relative;
      outline: 2px solid transparent;
      outline-offset: -2px;
      transition: outline-color .1s;
      cursor: pointer;
    }
    .canvas-el:hover { outline-color: rgba(59,130,246,.4); }
    .canvas-el.selected { outline-color: var(--primary); }
    .canvas-el .el-actions {
      position: absolute;
      top: 4px;
      right: 4px;
      display: none;
      gap: 4px;
      z-index: 10;
    }
    .canvas-el.selected .el-actions { display: flex; }
    .el-actions button {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #1e293b;
      color: #fff;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .el-actions button:hover { background: #334155; }
    .el-actions .btn-del:hover { background: var(--danger); }

    .props-panel {
      width: 280px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    .props-header {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
    }
    .props-body { flex: 1; overflow-y: auto; padding: 16px; }
    .prop-group { margin-bottom: 16px; }
    .prop-group label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .prop-group input[type="text"],
    .prop-group input[type="number"],
    .prop-group select,
    .prop-group textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .prop-group input:focus, .prop-group select:focus { border-color: var(--primary); }
    .color-row { display: flex; gap: 8px; align-items: center; }
    .color-row input[type="color"] {
      width: 40px;
      height: 36px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }
    .color-presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .color-swatch:hover { border-color: #fff; }
    .props-empty {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 40px 16px;
      line-height: 1.6;
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-mask.show { display: flex; }
    .modal {
      background: var(--panel);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 { font-size: 17px; }
    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
    }
    .modal-close:hover { background: #334155; color: #fff; }
    .modal-body { flex: 1; overflow-y: auto; padding: 12px; }
    .modal-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .project-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s;
    }
    .project-item:hover { background: #334155; }
    .project-item .info { flex: 1; min-width: 0; }
    .project-item .title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-item .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .project-item .del-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      flex-shrink: 0;
    }
    .project-item .del-btn:hover { background: var(--danger); color: #fff; }
    .empty-projects {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #16a34a;
      color: #fff;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      z-index: 2000;
      opacity: 0;
      transition: all .25s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus { border-color: var(--primary); }
    .url-preview {
      background: #0f172a;
      padding: 10px 12px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      border: 1px solid var(--border);
      margin-top: 8px;
    }
    .error-text { color: #f87171; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>

  <div id="homeView">
    <h1>DIY 电商网页搭建平台</h1>
    <p class="sub">拖拽组件 · 自选颜色 · 快速做出电商页面模型</p>
    <div class="home-actions">
      <button class="btn-home btn-primary" onclick="createNewProject()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建项目
      </button>
      <button class="btn-home btn-secondary" onclick="showProjectsModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        我的项目
      </button>
    </div>
  </div>

  <div id="editorView">
    <div class="topbar">
      <div class="topbar-left">
        <button class="btn-secondary" style="padding:6px 12px;" onclick="backToHome()">← 返回</button>
        <h2 id="editorTitle">未命名项目</h2>
      </div>
      <div class="topbar-right">
        <span class="status-text" id="saveStatus">未保存</span>
        <button class="btn-secondary" onclick="showProjectsModal()">项目</button>
        <button class="btn-secondary" onclick="previewPage()">预览</button>
        <button class="btn-primary" onclick="saveProject()">保存</button>
        <button class="btn-success" onclick="exportHTML()">导出代码</button>
        <button class="btn-secondary" onclick="showPublishModal()">发布</button>
      </div>
    </div>

    <div class="editor-body">
      <div class="palette">
        <div class="palette-tabs" id="paletteTabs"></div>
        <div class="palette-list" id="paletteList"></div>
      </div>

      <div class="canvas-wrap">
        <div class="canvas-toolbar">
          <span>画布 · 从左侧拖入组件</span>
          <button class="btn-secondary" style="padding:4px 10px;font-size:12px;" onclick="togglePhoneMode()">手机预览</button>
          <button class="btn-secondary" style="padding:4px 10px;font-size:12px;" onclick="clearCanvas()">清空</button>
        </div>
        <div class="canvas-scroll">
          <div class="canvas phone" id="canvas">
            <div class="canvas-drop-zone" id="dropZone"></div>
          </div>
        </div>
      </div>

      <div class="props-panel">
        <div class="props-header">属性设置</div>
        <div class="props-body" id="propsBody">
          <div class="props-empty">选中画布中的组件<br>即可修改颜色、文字等</div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="projectsModal">
    <div class="modal">
      <div class="modal-header">
        <h3>我的项目</h3>
        <button class="modal-close" onclick="hideProjectsModal()">×</button>
      </div>
      <div class="modal-body" id="projectsList"></div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="hideProjectsModal()">关闭</button>
        <button class="btn-primary" onclick="hideProjectsModal(); createNewProject();">新建项目</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="publishModal">
    <div class="modal">
      <div class="modal-header">
        <h3>发布网页</h3>
        <button class="modal-close" onclick="hidePublishModal()">×</button>
      </div>
      <div class="modal-body" style="padding:20px;">
        <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">设置访问地址后，别人可通过链接直接打开你的页面</p>
        <div class="form-group">
          <label>访问地址（slug）</label>
          <input type="text" id="publishSlug" placeholder="例如：my-shop">
          <div class="url-preview" id="publishUrlPreview">/p/xxx</div>
        </div>
        <div class="error-text" id="publishError"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="hidePublishModal()">取消</button>
        <button class="btn-success" onclick="doPublish()">确认发布</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="previewModal">
    <div class="modal" style="max-width:420px;height:85vh;">
      <div class="modal-header">
        <h3>页面预览</h3>
        <button class="modal-close" onclick="hidePreviewModal()">×</button>
      </div>
      <div class="modal-body" style="padding:0;background:#fff;">
        <iframe id="previewFrame" style="width:100%;height:100%;border:none;min-height:60vh;"></iframe>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const ICONS = {
      cart: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>',
      heart: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
      search: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
      user: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      home: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
      grid: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>',
      star: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
      plus: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    };

    function iconSized(svg, size) {
      return svg.replace(/width="24"/g, 'width="'+size+'"').replace(/height="24"/g, 'height="'+size+'"');
    }

    const COMPONENT_DEFS = [
      { type: 'icon-cart', name: '购物车图标', category: 'icons',
        defaults: { color: '#374151', size: 24 },
        render: function(p) { return '<span style="display:inline-flex;color:'+p.color+';padding:8px;">'+iconSized(ICONS.cart,p.size)+'</span>'; } },
      { type: 'icon-heart', name: '收藏心形', category: 'icons',
        defaults: { color: '#ef4444', size: 24 },
        render: function(p) { return '<span style="display:inline-flex;color:'+p.color+';padding:8px;">'+iconSized(ICONS.heart,p.size)+'</span>'; } },
      { type: 'icon-search', name: '搜索图标', category: 'icons',
        defaults: { color: '#6b7280', size: 24 },
        render: function(p) { return '<span style="display:inline-flex;color:'+p.color+';padding:8px;">'+iconSized(ICONS.search,p.size)+'</span>'; } },
      { type: 'icon-user', name: '用户图标', category: 'icons',
        defaults: { color: '#374151', size: 24 },
        render: function(p) { return '<span style="display:inline-flex;color:'+p.color+';padding:8px;">'+iconSized(ICONS.user,p.size)+'</span>'; } },
      { type: 'icon-star', name: '星星图标', category: 'icons',
        defaults: { color: '#f59e0b', size: 24 },
        render: function(p) { return '<span style="display:inline-flex;color:'+p.color+';padding:8px;">'+iconSized(ICONS.star,p.size)+'</span>'; } },

      { type: 'nav-top', name: '顶部导航栏', category: 'nav',
        defaults: { bgColor: '#ffffff', textColor: '#111827', logoText: 'Shop', menu1: '首页', menu2: '分类' },
        render: function(p) {
          return '<nav style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:'+p.bgColor+';border-bottom:1px solid #e5e7eb;font-family:system-ui,sans-serif;">'+
            '<div style="display:flex;align-items:center;gap:16px;">'+
              '<span style="font-size:18px;font-weight:700;color:'+p.textColor+';">'+esc(p.logoText)+'</span>'+
              '<a href="#" style="color:'+p.textColor+';text-decoration:none;font-size:14px;opacity:.8;">'+esc(p.menu1)+'</a>'+
              '<a href="#" style="color:'+p.textColor+';text-decoration:none;font-size:14px;opacity:.8;">'+esc(p.menu2)+'</a>'+
            '</div>'+
            '<div style="display:flex;align-items:center;gap:14px;color:'+p.textColor+';">'+
              iconSized(ICONS.search,20)+iconSized(ICONS.user,20)+
              '<span style="position:relative;display:inline-flex;">'+iconSized(ICONS.cart,20)+

      { type: 'qty-selector', name: '数量选择器', category: 'ecom',
        defaults: { value: '1', borderColor: '#e5e7eb' },
        render: function(p) {
          return '<div style="padding:8px 16px;font-family:system-ui,sans-serif;"><div style="display:inline-flex;align-items:center;border:1px solid '+p.borderColor+';border-radius:6px;overflow:hidden;"><button style="width:36px;height:36px;border:none;background:#f9fafb;color:#374151;font-size:18px;cursor:pointer;">−</button><span style="width:44px;text-align:center;font-size:15px;color:#111;">'+esc(p.value)+'</span><button style="width:36px;height:36px;border:none;background:#f9fafb;color:#374151;font-size:18px;cursor:pointer;">+</button></div></div>';
        }},
      { type: 'section-title', name: '分区标题', category: 'ecom',
        defaults: { title: '热销推荐', moreText: '查看更多', color: '#111827' },
        render: function(p) {
          return '<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;font-family:system-ui,sans-serif;"><span style="font-size:16px;font-weight:600;color:'+p.color+';">'+esc(p.title)+'</span><span style="font-size:12px;color:#9ca3af;">'+esc(p.moreText)+' ›</span></div>';
        }},
      { type: 'spacer', name: '空白间距', category: 'ecom',
        defaults: { height: 16, bgColor: 'transparent' },
        render: function(p) { return '<div style="height:'+p.height+'px;background:'+p.bgColor+';"></div>'; } },
    ];

    const CATEGORIES = [
      { id: 'icons', label: '图标' },
      { id: 'nav', label: '导航' },
      { id: 'btn', label: '按钮' },
      { id: 'ecom', label: '电商' },
    ];
    const COLOR_PRESETS = ['#ef4444','#f59e0b','#22c55e','#3b82f6','#8b5cf6','#ec4899','#111827','#6b7280','#ffffff','#f3f4f6'];

    const STORAGE_KEY = 'diy-builder-v3';
    var projects = {};
    var currentProjectId = null;
    var elements = [];
    var selectedId = null;
    var currentTab = 'ecom';
    var phoneMode = true;
    var dragType = null;

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function uid() { return 'el_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
    function toast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function(){ t.classList.remove('show'); }, 2000);
    }
    function getDef(type) {
      for (var i=0;i<COMPONENT_DEFS.length;i++) if (COMPONENT_DEFS[i].type===type) return COMPONENT_DEFS[i];
      return null;
    }

    function loadProjects() {
      try { projects = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { projects = {}; }
    }
    function persistProjects() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
    }

    function showHome() {
      document.getElementById('homeView').style.display = 'flex';
      document.getElementById('editorView').classList.remove('show');
    }
    function showEditor() {
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('editorView').classList.add('show');
    }
    function backToHome() {
      if (elements.length && !confirm('返回首页？未保存的修改将丢失（请先点保存）')) return;
      showHome();
    }

    function createNewProject() {
      var title = prompt('项目名称', '我的电商页面') || '我的电商页面';
      var id = 'p_' + Date.now().toString(36);
      currentProjectId = id;
      elements = [];
      selectedId = null;
      projects[id] = { id: id, title: title, elements: [], updated_at: new Date().toISOString(), created_at: new Date().toISOString() };
      persistProjects();
      document.getElementById('editorTitle').textContent = title;
      document.getElementById('saveStatus').textContent = '新项目';
      showEditor();
      renderPalette();
      renderCanvas();
      renderProps();
      toast('已创建空白项目，从左侧拖入组件开始搭建');
    }

    function openProject(id) {
      var p = projects[id];
      if (!p) return;
      currentProjectId = id;
      elements = JSON.parse(JSON.stringify(p.elements || []));
      selectedId = null;
      document.getElementById('editorTitle').textContent = p.title;
      document.getElementById('saveStatus').textContent = '已打开';
      hideProjectsModal();
      showEditor();
      renderPalette();
      renderCanvas();
      renderProps();
      toast('已打开：' + p.title);
    }

    function saveProject() {
      if (!currentProjectId) return;
      var p = projects[currentProjectId];
      if (!p) return;
      p.elements = JSON.parse(JSON.stringify(elements));
      p.updated_at = new Date().toISOString();
      persistProjects();
      document.getElementById('saveStatus').textContent = '已保存 ' + new Date().toLocaleTimeString();
      toast('项目已保存');
      var html = generateFullHTML();
      fetch('/api/projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: currentProjectId, title: p.title, html: html })
      }).catch(function(){});
    }

    function deleteProject(id, e) {
      e.stopPropagation();
      if (!confirm('确定删除该项目？')) return;
      delete projects[id];
      persistProjects();
      renderProjectsList();
      if (currentProjectId === id) { currentProjectId = null; showHome(); }
      toast('已删除');
    }

    function showProjectsModal() {
      loadProjects();
      renderProjectsList();
      document.getElementById('projectsModal').classList.add('show');
    }
    function hideProjectsModal() {
      document.getElementById('projectsModal').classList.remove('show');
    }
    function renderProjectsList() {
      var list = Object.keys(projects).map(function(k){ return projects[k]; }).sort(function(a,b){ return new Date(b.updated_at) - new Date(a.updated_at); });
      var el = document.getElementById('projectsList');
      if (!list.length) {
        el.innerHTML = '<div class="empty-projects">暂无项目<br>点击下方「新建项目」开始</div>';
        return;
      }
      el.innerHTML = list.map(function(p) {
        return '<div class="project-item" onclick="openProject(\''+p.id+'\')">'+
          '<div class="info"><div class="title">'+esc(p.title)+'</div>'+
          '<div class="meta">'+(p.elements||[]).length+' 个组件 · '+new Date(p.updated_at).toLocaleString()+'</div></div>'+
          '<button class="del-btn" onclick="deleteProject(\''+p.id+'\', event)" title="删除">🗑</button></div>';
      }).join('');
    }

    function renderPalette() {
      var tabs = document.getElementById('paletteTabs');
      tabs.innerHTML = CATEGORIES.map(function(c) {
        return '<button class="palette-tab '+(c.id===currentTab?'active':'')+'" onclick="switchTab(\''+c.id+'\')">'+c.label+'</button>';
      }).join('');
      var list = document.getElementById('paletteList');
      var comps = COMPONENT_DEFS.filter(function(d){ return d.category===currentTab; });
      list.innerHTML = '<div class="palette-hint">按住组件拖到中间画布，或点击快速添加</div>' +
        comps.map(function(d) {
          return '<div class="comp-card" draggable="true" data-type="'+d.type+'" ondragstart="onPaletteDragStart(event,\''+d.type+'\')" onclick="addComponent(\''+d.type+'\')">'+
            '<div class="comp-preview">'+d.render(d.defaults)+'</div>'+
            '<div class="comp-name">'+esc(d.name)+'</div></div>';
        }).join('');
    }
    function switchTab(id) { currentTab = id; renderPalette(); }

    function addComponent(type) {
      var def = getDef(type);
      if (!def) return;
      var el = { id: uid(), type: type, props: Object.assign({}, def.defaults) };
      elements.push(el);
      selectedId = el.id;
      renderCanvas();
      renderProps();
      toast('已添加：' + def.name);
    }
    function onPaletteDragStart(e, type) {
      dragType = type;
      e.dataTransfer.setData('text/plain', type);
      e.dataTransfer.effectAllowed = 'copy';
    }
    function setupDropZone() {
      var zone = document.getElementById('dropZone');
      var canvas = document.getElementById('canvas');
      canvas.addEventListener('dragover', function(e){ e.preventDefault(); zone.classList.add('drag-over'); });
      canvas.addEventListener('dragenter', function(e){ e.preventDefault(); zone.classList.add('drag-over'); });
      canvas.addEventListener('dragleave', function(e){ if (!canvas.contains(e.relatedTarget)) zone.classList.remove('drag-over'); });
      canvas.addEventListener('drop', function(e){
        e.preventDefault();
        zone.classList.remove('drag-over');
        var type = e.dataTransfer.getData('text/plain') || dragType;
        if (type) addComponent(type);
        dragType = null;
      });
    }

    function renderCanvas() {
      var zone = document.getElementById('dropZone');
      if (!elements.length) {
        zone.innerHTML = '<div class="empty-hint"><div style="font-size:32px;opacity:.4;">↓</div><div>从左侧拖入组件</div><div style="font-size:12px;">或点击组件快速添加</div></div>';
        return;
      }
      zone.innerHTML = elements.map(function(el) {
        var def = getDef(el.type);
        if (!def) return '';
        return '<div class="canvas-el '+(el.id===selectedId?'selected':'')+'" data-id="'+el.id+'" onclick="selectEl(\''+el.id+'\', event)">'+
          '<div class="el-actions">'+
            '<button onclick="moveEl(\''+el.id+'\',-1,event)" title="上移">↑</button>'+
            '<button onclick="moveEl(\''+el.id+'\',1,event)" title="下移">↓</button>'+
            '<button class="btn-del" onclick="removeEl(\''+el.id+'\',event)" title="删除">×</button>'+
          '</div>'+def.render(el.props)+'</div>';
      }).join('');
    }

    function selectEl(id, e) {
      if (e) e.stopPropagation();
      selectedId = id;
      renderCanvas();
      renderProps();
    }
    function removeEl(id, e) {
      e.stopPropagation();
      elements = elements.filter(function(el){ return el.id !== id; });
      if (selectedId === id) selectedId = null;
      renderCanvas();
      renderProps();
    }
    function moveEl(id, dir, e) {
      e.stopPropagation();
      var idx = -1;
      for (var i=0;i<elements.length;i++) if (elements[i].id===id) { idx=i; break; }
      if (idx < 0) return;
      var newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= elements.length) return;
      var tmp = elements[idx];
      elements[idx] = elements[newIdx];
      elements[newIdx] = tmp;
      renderCanvas();
    }
    function clearCanvas() {
      if (!elements.length) return;
      if (!confirm('确定清空画布上的所有组件？')) return;
      elements = [];
      selectedId = null;
      renderCanvas();
      renderProps();
    }
    function togglePhoneMode() {
      phoneMode = !phoneMode;
      document.getElementById('canvas').classList.toggle('phone', phoneMode);
    }

    function renderProps() {
      var body = document.getElementById('propsBody');
      var el = null;
      for (var i=0;i<elements.length;i++) if (elements[i].id===selectedId) { el=elements[i]; break; }
      if (!el) {
        body.innerHTML = '<div class="props-empty">选中画布中的组件<br>即可修改颜色、文字等</div>';
        return;
      }
      var def = getDef(el.type);
      var props = el.props;
      var html = '<div style="font-size:13px;font-weight:600;margin-bottom:14px;color:#e2e8f0;">'+esc(def.name)+'</div>';
      var keys = Object.keys(props);
      for (var k=0;k<keys.length;k++) {
        var key = keys[k];
        var val = props[key];
        var isColor = /color|Color|bgColor|textColor|borderColor|priceColor|btnColor|activeColor|inactiveColor/i.test(key);
        var label = propLabel(key);
        if (isColor) {
          html += '<div class="prop-group"><label>'+label+'</label><div class="color-row">'+
            '<input type="color" value="'+toHex(val)+'" oninput="updateProp(\''+key+'\', this.value)">'+
            '<input type="text" value="'+esc(val)+'" onchange="updateProp(\''+key+'\', this.value)" style="flex:1;"></div>'+
            '<div class="color-presets">'+COLOR_PRESETS.map(function(c){
              return '<div class="color-swatch" style="background:'+c+';'+(c==='#ffffff'?'border:1px solid #ccc;':'')+'" onclick="updateProp(\''+key+'\',\''+c+'\')"></div>';
            }).join('')+'</div></div>';
        } else if (typeof val === 'number' || key === 'size' || key === 'height' || key === 'radius' || key === 'value') {
          html += '<div class="prop-group"><label>'+label+'</label><input type="number" value="'+val+'" onchange="updateProp(\''+key+'\', +this.value||this.value)"></div>';
        } else {
          html += '<div class="prop-group"><label>'+label+'</label><input type="text" value="'+esc(val)+'" onchange="updateProp(\''+key+'\', this.value)"></div>';
        }
      }
      body.innerHTML = html;
    }

    function propLabel(key) {
      var map = {
        color:'颜色', size:'尺寸', bgColor:'背景色', textColor:'文字颜色',
        logoText:'Logo文字', menu1:'菜单1', menu2:'菜单2',
        text:'按钮文字', radius:'圆角', borderColor:'边框色',
        title:'标题', subtitle:'副标题', bgColor1:'渐变色1', bgColor2:'渐变色2',
        placeholder:'占位文字', name:'商品名称', price:'价格', originPrice:'原价',
        sales:'销量', priceColor:'价格颜色', btnColor:'按钮颜色', btnText:'按钮文字',
        value:'数量', moreText:'更多文字', height:'高度',
        activeColor:'选中色', inactiveColor:'未选中色'
      };
      return map[key] || key;
    }
    function toHex(c) {
      if (!c) return '#000000';
      if (c.indexOf('#')===0 && c.length===7) return c;
      return '#3b82f6';
    }
    function updateProp(key, value) {
      var el = null;
      for (var i=0;i<elements.length;i++) if (elements[i].id===selectedId) { el=elements[i]; break; }
      if (!el) return;
      el.props[key] = value;
      renderCanvas();
      if (/color|Color/i.test(key)) renderProps();
    }

    function generateFullHTML() {
      var title = (projects[currentProjectId] && projects[currentProjectId].title) || '我的页面';
      var body = elements.map(function(el) {
        var def = getDef(el.type);
        return def ? def.render(el.props) : '';
      }).join('\n');
      return '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>'+esc(title)+'</title>\n<style>\n* { margin:0; padding:0; box-sizing:border-box; }\nbody { font-family:system-ui,-apple-system,sans-serif; background:#f5f5f5; color:#111; max-width:430px; margin:0 auto; min-height:100vh; }\n</style>\n</head>\n<body>\n'+body+'\n</body>\n</html>';
    }

    function exportHTML() {
      if (!elements.length) { alert('画布为空，请先添加组件'); return; }
      var html = generateFullHTML();
      var title = (projects[currentProjectId] && projects[currentProjectId].title) || 'my-page';
      var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = title.replace(/[\\/:*?"<>|]/g, '_') + '.html';
      a.click();
      URL.revokeObjectURL(a.href);
      toast('代码已导出');
    }

    function previewPage() {
      var html = generateFullHTML();
      document.getElementById('previewModal').classList.add('show');
      document.getElementById('previewFrame').srcdoc = html;
    }
    function hidePreviewModal() {
      document.getElementById('previewModal').classList.remove('show');
    }

    function showPublishModal() {
      if (!currentProjectId) { alert('请先保存项目'); return; }
      if (!elements.length) { alert('画布为空'); return; }
      document.getElementById('publishError').textContent = '';
      document.getElementById('publishSlug').value = '';
      document.getElementById('publishUrlPreview').textContent = location.origin + '/p/xxx';
      document.getElementById('publishModal').classList.add('show');
      document.getElementById('publishSlug').oninput = function(e) {
        var s = e.target.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
        document.getElementById('publishUrlPreview').textContent = location.origin + '/p/' + (s || 'xxx');
      };
    }
    function hidePublishModal() {
      document.getElementById('publishModal').classList.remove('show');
    }
    function doPublish() {
      var slug = document.getElementById('publishSlug').value.trim().toLowerCase();
      var err = document.getElementById('publishError');
      err.textContent = '';
      if (!/^[a-z0-9-]{3,30}$/.test(slug)) {
        err.textContent = 'slug 只能包含小写字母、数字、短横线，长度 3-30';
        return;
      }
      saveProject();
      var html = generateFullHTML();
      fetch('/api/projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: currentProjectId, title: projects[currentProjectId].title, html: html })
      }).then(function() {
        return fetch('/api/projects/' + currentProjectId + '/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug: slug })
        });
      }).then(function(res) {
        return res.json().then(function(data) {
          if (!res.ok) throw new Error(data.error || '发布失败');
          hidePublishModal();
          alert('发布成功！\n' + location.origin + data.url);
          toast('发布成功');
        });
      }).catch(function(e) {
        err.textContent = e.message;
      });
    }

    function init() {
      loadProjects();
      renderPalette();
      setupDropZone();
      document.getElementById('canvas').addEventListener('click', function(e) {
        if (e.target.id === 'canvas' || e.target.id === 'dropZone' || e.target.classList.contains('empty-hint')) {
          selectedId = null;
          renderCanvas();
          renderProps();
        }
      });
    }
    init();
  </script>
</body>
</html>

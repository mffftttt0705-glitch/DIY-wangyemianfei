<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DIY 手机网页搭建平台</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      transition: background .15s, opacity .15s;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input, select, textarea { font-family: inherit; }

    /* 首页 */
    #homeView {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: radial-gradient(ellipse at top, #1e293b 0%, #0f172a 70%);
      padding: 20px;
    }
    #homeView h1 { font-size: 26px; font-weight: 700; text-align: center; }
    #homeView .sub { color: var(--muted); font-size: 14px; text-align: center; margin-top: -12px; }
    .home-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .btn-home {
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #334155; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }

    /* 编辑器 */
    #editorView { display: none; height: 100vh; flex-direction: column; position: relative; }
    #editorView.show { display: flex; }

    .topbar {
      height: 48px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      flex-shrink: 0;
      gap: 8px;
    }
    .topbar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .topbar-left h2 { font-size: 14px; font-weight: 600; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topbar-right { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .topbar button { padding: 6px 10px; font-size: 12px; }
    .status-text { font-size: 11px; color: var(--muted); }

    .editor-body { flex: 1; display: flex; overflow: hidden; }

    /* 左侧 */
    .palette {
      width: 220px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .palette-tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
    .palette-tab {
      flex: 1;
      min-width: 50%;
      padding: 8px 2px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      background: transparent;
      border-radius: 0;
    }
    .palette-tab:hover { color: var(--text); background: #334155; }
    .palette-tab.active { color: #60a5fa; border-bottom-color: var(--primary); }
    .palette-list { flex: 1; overflow-y: auto; padding: 10px; }
    .palette-hint { font-size: 10px; color: var(--muted); margin-bottom: 8px; line-height: 1.4; }
    .comp-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 6px;
      cursor: grab;
      user-select: none;
      transition: border-color .15s;
    }
    .comp-card:hover { border-color: var(--primary); }
    .comp-card .comp-preview {
      display: flex; align-items: center; justify-content: center;
      min-height: 28px; margin-bottom: 4px; color: #94a3b8; overflow: hidden;
    }
    .comp-card .comp-preview svg { width: 20px; height: 20px; }
    .comp-card .comp-name { font-size: 11px; text-align: center; color: var(--muted); }

    /* 页面标签 */
    .pages-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      background: #0f172a;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
    }
    .page-tab {
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      background: transparent;
      color: var(--muted);
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .page-tab.active { background: var(--primary); color: #fff; }
    .page-tab:hover:not(.active) { background: #334155; color: var(--text); }
    .page-add {
      padding: 5px 10px;
      font-size: 12px;
      background: transparent;
      color: #60a5fa;
      border: 1px dashed #334155;
      border-radius: 6px;
    }

    /* 画布 - 固定手机尺寸 */
    .canvas-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0b1220;
      overflow: hidden;
    }
    .canvas-toolbar {
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .canvas-toolbar span { font-size: 11px; color: var(--muted); }
    .canvas-scroll {
      flex: 1;
      overflow: auto;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    /* 手机外框 */
    .phone-frame {
      width: 375px;
      flex-shrink: 0;
      background: #1a1a1a;
      border-radius: 36px;
      padding: 12px;
      box-shadow: 0 12px 48px rgba(0,0,0,.5), inset 0 0 0 2px #333;
    }
    .phone-notch {
      width: 120px;
      height: 28px;
      background: #1a1a1a;
      border-radius: 0 0 16px 16px;
      margin: -4px auto 8px;
      position: relative;
      z-index: 2;
    }
    .phone-screen {
      width: 100%;
      height: 667px;
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
    }
    .phone-screen.preview-mode { cursor: default; }
    .canvas-drop-zone {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      border: 2px dashed transparent;
      transition: border-color .15s, background .15s;
      -webkit-overflow-scrolling: touch;
    }
    .canvas-drop-zone.drag-over {
      border-color: var(--primary);
      background: rgba(59,130,246,.06);
    }
    .empty-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #94a3b8;
      font-size: 13px;
      gap: 6px;
      pointer-events: none;
    }

    .canvas-el {
      position: relative;
      outline: 2px solid transparent;
      outline-offset: -2px;
      transition: outline-color .1s;
      cursor: pointer;
    }
    .canvas-el:hover { outline-color: rgba(59,130,246,.35); }
    .canvas-el.selected { outline-color: var(--primary); }
    .canvas-el .el-actions {
      position: absolute;
      top: 2px;
      right: 2px;
      display: none;
      gap: 3px;
      z-index: 10;
    }
    .canvas-el.selected .el-actions { display: flex; }
    .el-actions button {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      background: #1e293b;
      color: #fff;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .el-actions button:hover { background: #334155; }
    .el-actions .btn-del:hover { background: var(--danger); }
    .link-badge {
      position: absolute;
      bottom: 2px;
      left: 2px;
      background: rgba(59,130,246,.9);
      color: #fff;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 4px;
      display: none;
      z-index: 5;
    }
    .canvas-el.selected .link-badge,
    .canvas-el:hover .link-badge { display: block; }

    /* 右侧属性 */
    .props-panel {
      width: 260px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    .props-header {
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
    }
    .props-body { flex: 1; overflow-y: auto; padding: 14px; }
    .prop-group { margin-bottom: 14px; }
    .prop-group label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .prop-group input[type="text"],
    .prop-group input[type="number"],
    .prop-group select {
      width: 100%;
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 12px;
      outline: none;
    }
    .prop-group input:focus, .prop-group select:focus { border-color: var(--primary); }
    .color-row { display: flex; gap: 6px; align-items: center; }
    .color-row input[type="color"] {
      width: 36px; height: 32px;
      border: none; border-radius: 6px;
      cursor: pointer; background: transparent; padding: 0;
    }
    .color-presets { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .color-swatch {
      width: 24px; height: 24px;
      border-radius: 5px; cursor: pointer;
      border: 2px solid transparent;
    }
    .color-swatch:hover { border-color: #fff; }
    .props-empty {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 36px 12px;
      line-height: 1.6;
    }
    .size-row { display: flex; gap: 8px; }
    .size-row > div { flex: 1; }

    /* 自定义弹窗 */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-mask.show { display: flex; }
    .modal {
      background: var(--panel);
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      overflow: hidden;
      animation: modalIn .2s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 { font-size: 16px; }
    .modal-close {
      width: 30px; height: 30px;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
    }
    .modal-close:hover { background: #334155; color: #fff; }
    .modal-body { flex: 1; overflow-y: auto; padding: 16px 18px; }
    .modal-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .modal-footer button { padding: 8px 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus { border-color: var(--primary); }
    .modal-msg { font-size: 14px; line-height: 1.6; color: var(--text); }

    .project-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s;
    }
    .project-item:hover { background: #334155; }
    .project-item .info { flex: 1; min-width: 0; }
    .project-item .title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-item .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .project-item .del-btn {
      width: 30px; height: 30px;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      flex-shrink: 0;
    }
    .project-item .del-btn:hover { background: var(--danger); color: #fff; }
    .empty-projects { text-align: center; padding: 40px 16px; color: var(--muted); font-size: 13px; }

    .url-preview {
      background: #0f172a;
      padding: 10px 12px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      border: 1px solid var(--border);
      margin-top: 8px;
    }
    .error-text { color: #f87171; font-size: 13px; margin-top: 8px; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #16a34a;
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 2000;
      opacity: 0;
      transition: all .25s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 预览时手机内交互 */
    .preview-search-input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 14px;
      color: #111;
    }

    @media (max-width: 900px) {
      .palette { width: 180px; }
      .props-panel { width: 200px; }
      .phone-frame { transform: scale(0.85); transform-origin: top center; }
    }

    .bottom-sheet {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 45vh;
      max-height: 420px;
      min-height: 200px;
      background: var(--panel);
      border-radius: 16px 16px 0 0;
      border-top: 1px solid var(--border);
      box-shadow: 0 -8px 32px rgba(0,0,0,.4);
      z-index: 30;
      display: flex;
      flex-direction: column;
      transition: transform .28s cubic-bezier(.4,0,.2,1);
    }
    .bottom-sheet.collapsed { transform: translateY(calc(100% - 44px)); }
    .sheet-handle {
      height: 44px; flex: 0 0 44px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      cursor: pointer; position: relative; user-select: none;
      border-bottom: 1px solid var(--border);
    }
    .sheet-bar { width: 40px; height: 4px; border-radius: 2px; background: #64748b; }
    .sheet-title { font-size: 12px; color: var(--muted); }
    .sheet-toggle {
      position: absolute; right: 12px; top: 8px; padding: 4px 10px;
      font-size: 11px; background: #334155; color: var(--text); border-radius: 6px;
    }
    /* 可滚动区域：固定剩余高度，不靠 flex 猜高度 */
    .sheet-scroll {
      height: calc(45vh - 44px);
      max-height: calc(420px - 44px);
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 10px 12px 28px;
    }
    .bottom-sheet.collapsed .sheet-scroll { display: none; }
    .sheet-tabs {
      display: flex; gap: 4px; padding: 0 0 10px; flex-wrap: wrap;
      position: sticky; top: 0; background: var(--panel); z-index: 2; padding-top: 2px;
    }
    .sheet-tab {
      padding: 6px 14px; border-radius: 20px; font-size: 12px;
      background: transparent; color: var(--muted); border: none; cursor: pointer;
    }
    .sheet-tab.active { background: var(--primary); color: #fff; }
    .comp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    @media (min-width: 600px) { .comp-grid { grid-template-columns: repeat(6, 1fr); } }
    @media (max-width: 480px) {
      .bottom-sheet { height: 50vh; max-height: none; }
      .sheet-scroll { height: calc(50vh - 44px); max-height: none; }
      .comp-grid { grid-template-columns: repeat(3, 1fr); }
      .phone-frame { width: 300px; max-width: 88vw; }
    }
    .props-back { padding: 4px 10px; font-size: 12px; background: #334155; color: var(--text); border-radius: 6px; }
    .props-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
    .stage-full {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      background: #0b1220; position: relative; overflow: hidden;
    }
    .stage-full .canvas-scroll {
      flex: 1; min-height: 0; overflow: auto; padding: 12px;
      display: flex; justify-content: center; -webkit-overflow-scrolling: touch;
    }
    .phone-screen { height: min(560px, calc(100vh - 180px)) !important; }
    .palette, .props-panel, .editor-body, .sheet-body, .sheet-content { display: none !important; }

    /* 美图式缩放手柄 */
    .canvas-el {
      position: relative;
      outline: 2px solid transparent;
      outline-offset: 2px;
      transition: outline-color .1s;
      cursor: pointer;
      transform-origin: top center;
    }
    .canvas-el:hover { outline-color: rgba(59,130,246,.35); }
    .canvas-el.selected {
      outline: 2px solid #3b82f6 !important;
      outline-offset: 2px;
    }
    .resize-handle {
      position: absolute; width: 14px; height: 14px;
      background: #fff; border: 2px solid #3b82f6; border-radius: 50%;
      z-index: 20; display: none;
      box-shadow: 0 1px 4px rgba(0,0,0,.25);
      touch-action: none;
    }
    .canvas-el.selected .resize-handle { display: block; }
    .resize-handle.br { right: -7px; bottom: -7px; cursor: nwse-resize; }
    .resize-handle.bl { left: -7px; bottom: -7px; cursor: nesw-resize; }
    .resize-handle.tr { right: -7px; top: -7px; cursor: nesw-resize; }
    .resize-handle.tl { left: -7px; top: -7px; cursor: nwse-resize; }
    .scale-tag {
      position: absolute; left: 50%; bottom: -22px; transform: translateX(-50%);
      background: #3b82f6; color: #fff; font-size: 10px; padding: 1px 6px;
      border-radius: 4px; display: none; white-space: nowrap; z-index: 21;
    }
    .canvas-el.selected .scale-tag { display: block; }

    .nav-item-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      background: #0f172a; border: 1px solid var(--border); border-radius: 8px;
      padding: 10px; margin-bottom: 8px;
    }
    .nav-item-row select, .nav-item-row input[type=text] {
      flex: 1; min-width: 80px; padding: 6px 8px; border-radius: 6px;
      border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 12px;
    }
    .nav-add-row { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
    .nav-add-row button { padding: 8px 12px; font-size: 12px; }



    .canvas-drop-zone { position: relative; min-height: 100%; }
    .canvas-el.layout-free {
      position: absolute !important;
      z-index: 5;
      cursor: move;
      max-width: 100%;
    }
    .canvas-el.layout-free.selected { z-index: 8; }
    .canvas-el.pin-top, .canvas-el.pin-bottom {
      position: sticky !important;
      z-index: 15;
      left: 0; right: 0;
      width: 100%;
    }
    .canvas-el.pin-top { top: 0; }
    .canvas-el.pin-bottom { bottom: 0; }
    .pin-layer {
      position: absolute; left: 0; right: 0; z-index: 25;
      pointer-events: auto;
    }
    .pin-layer.top { top: 0; }
    .pin-layer.bottom { bottom: 0; }
    .phone-screen { isolation: isolate; }
    .free-badge {
      position: absolute; top: -18px; left: 0;
      font-size: 9px; background: #8b5cf6; color: #fff;
      padding: 1px 5px; border-radius: 4px; display: none; z-index: 22;
    }
    .canvas-el.selected .free-badge { display: block; }
    .pin-badge {
      position: absolute; top: -18px; right: 28px;
      font-size: 9px; background: #f59e0b; color: #fff;
      padding: 1px 5px; border-radius: 4px; display: none; z-index: 22;
    }
    .canvas-el.selected .pin-badge { display: block; }


    /* 选中效果：底线 / 描边 */
    .sel-effect {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 8px;
      cursor: pointer;
      box-sizing: border-box;
      border: 2px solid transparent;
      border-radius: 8px;
    }
    .sel-effect.fx-stroke {
      border-color: currentColor;
      border-width: 2.5px;
    }
    .sel-effect.fx-underline {
      border-bottom: 3px solid currentColor;
      border-radius: 8px 8px 0 0;
    }
    .sel-effect.fx-color { font-weight: 600; }
    .tab-fx {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .tab-fx.fx-underline::after {
      content: '';
      position: absolute;
      left: 20%; right: 20%; bottom: 0;
      height: 3px;
      background: currentColor;
      border-radius: 2px;
    }
    .tab-fx.fx-stroke {
      outline: 2px solid currentColor;
      outline-offset: 2px;
      border-radius: 8px;
    }

  </style>
</head>
<body>

  <div id="homeView">
    <h1>DIY 手机网页搭建平台</h1>
    <p class="sub">拖拽组件 · 多页面跳转 · 真实可交互</p>
    <div class="home-actions">
      <button class="btn-home btn-primary" onclick="openCreateModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建项目
      </button>
      <button class="btn-home btn-secondary" onclick="showProjectsModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        我的项目
      </button>
    </div>
  </div>

  <div id="editorView">
    <div class="topbar">
      <div class="topbar-left">
        <button class="btn-secondary" style="padding:5px 10px;" onclick="backToHome()">← 返回</button>
        <h2 id="editorTitle">未命名</h2>
      </div>
      <div class="topbar-right">
        <span class="status-text" id="saveStatus"></span>
        <button class="btn-secondary" id="btnPreviewMode" onclick="togglePreviewMode()">预览交互</button>
        <button class="btn-primary" onclick="saveProject()">保存</button>
        <button class="btn-success" onclick="exportHTML()">导出</button>
        <button class="btn-secondary" onclick="showPublishModal()">发布</button>
      </div>
    </div>

    <div class="pages-bar" id="pagesBar"></div>


    <div class="stage-full" id="stage">
      <div class="canvas-toolbar" style="padding:6px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--border);">
        <span id="modeHint" style="font-size:11px;color:var(--muted);">编辑中 · 底部添加组件</span>
        <button class="btn-secondary" style="padding:4px 8px;font-size:11px;" onclick="openClearModal()">清空本页</button>
        <button class="btn-secondary" style="padding:4px 8px;font-size:11px;" id="btnSheet" onclick="toggleSheet()">收起面板</button>
      </div>
      <div class="canvas-scroll" id="stageScroll">
        <div class="phone-frame">
          <div class="phone-notch"></div>
          <div class="phone-screen" id="phoneScreen">
            <div class="canvas-drop-zone" id="dropZone"></div>
          </div>
        </div>
      </div>
      <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-handle" id="sheetHandle">
          <div class="sheet-bar"></div>
          <span class="sheet-title" id="sheetTitle">添加组件</span>
          <button class="sheet-toggle" type="button" id="sheetToggleBtn">收起</button>
        </div>
        <div class="sheet-scroll" id="sheetScroll">
          <div id="sheetComps">
            <div class="sheet-tabs" id="paletteTabs"></div>
            <div id="paletteList"></div>
          </div>
          <div id="sheetProps" style="display:none;">
            <div id="propsBody"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- /editorView -->

  <!-- 新建项目弹窗 -->
  <div class="modal-mask" id="createModal">
    <div class="modal">
      <div class="modal-header">
        <h3>新建项目</h3>
        <button class="modal-close" onclick="hideModal('createModal')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>项目名称</label>
          <input type="text" id="createTitle" placeholder="例如：我的商城" maxlength="50">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="hideModal('createModal')">取消</button>
        <button class="btn-primary" onclick="confirmCreate()">创建</button>
      </div>
    </div>
  </div>

  <!-- 通用确认弹窗 -->
  <div class="modal-mask" id="confirmModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="confirmTitle">确认</h3>
        <button class="modal-close" onclick="hideModal('confirmModal')">×</button>
      </div>
      <div class="modal-body">
        <p class="modal-msg" id="confirmMsg"></p>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="hideModal('confirmModal')">取消</button>
        <button class="btn-danger" id="confirmOkBtn">确定</button>
      </div>
    </div>
  </div>

  <!-- 提示弹窗 -->
  <div class="modal-mask" id="alertModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="alertTitle">提示</h3>
        <button class="modal-close" onclick="hideModal('alertModal')">×</button>
      </div>
      <div class="modal-body">
        <p class="modal-msg" id="alertMsg"></p>
      </div>
      <div class="modal-footer">
        <button class="btn-primary" onclick="hideModal('alertModal')">知道了</button>
      </div>
    </div>
  </div>

  <!-- 项目列表 -->
  <div class="modal-mask" id="projectsModal">
    <div class="modal">
      <div class="modal-header">
        <h3>我的项目</h3>
        <button class="modal-close" onclick="hideModal('projectsModal')">×</button>
      </div>
      <div class="modal-body" id="projectsList"></div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="hideModal('projectsModal')">关闭</button>
        <button class="btn-primary" onclick="hideModal('projectsModal'); openCreateModal();">新建</button>
      </div>
    </div>
  </div>

  <!-- 新建页面 -->
  <div class="modal-mask" id="newPageModal">
    <div class="modal">
      <div class="modal-header">
        <h3>新建页面</h3>
        <button class="modal-close" onclick="hideModal('newPageModal')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>页面名称</label>
          <input type="text" id="newPageName" placeholder="例如：分类页、商品详情" maxlength="30">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="hideModal('newPageModal')">取消</button>
        <button class="btn-primary" onclick="confirmAddPage()">创建</button>
      </div>
    </div>
  </div>

  <!-- 发布 -->
  <div class="modal-mask" id="publishModal">
    <div class="modal">
      <div class="modal-header">
        <h3>发布网页</h3>
        <button class="modal-close" onclick="hideModal('publishModal')">×</button>
      </div>
      <div class="modal-body">
        <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">设置访问地址，别人可通过链接打开</p>
        <div class="form-group">
          <label>访问地址（slug）</label>
          <input type="text" id="publishSlug" placeholder="例如：my-shop">
          <div class="url-preview" id="publishUrlPreview">/p/xxx</div>
        </div>
        <div class="error-text" id="publishError"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="hideModal('publishModal')">取消</button>
        <button class="btn-success" onclick="doPublish()">确认发布</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ========== 图标 ==========
    var ICONS = {
      cart: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>',
      heart: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
      search: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
      user: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      home: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
      grid: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>',
      star: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
      plus: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
      back: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>',

      share: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>',
      msg: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
      loc: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
      bell: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>',
      bag: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>',
      gift: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>',
      camera: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
      filter: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>',
      check: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>',
    };
    function iconS(svg, size) {
      return svg.replace(/width="24"/g, 'width="'+size+'"').replace(/height="24"/g, 'height="'+size+'"');
    }
    function renderIconWithEffect(p, iconKey) {
      var key = iconKey || p.icon || 'home';
      var svg = ICONS[key] || ICONS.home;
      var size = p.size || 24;
      var isOn = !!p.isActive;
      var color = (isOn && p.effectColor !== false) ? (p.activeColor || '#3b82f6') : (p.color || '#374151');
      var cls = 'sel-effect';
      if (isOn && p.effectUnderline) cls += ' fx-underline';
      if (isOn && p.effectStroke) cls += ' fx-stroke';
      if (isOn && p.effectColor !== false) cls += ' fx-color';
      return '<span class="'+cls+'" data-role="tap" data-page="'+esc(p.linkPageId||'')+'" style="color:'+color+';">'+iconS(svg, size)+'</span>';
    }
    function defaultIconProps(color, iconKey) {
      return {
        icon: iconKey || '',
        color: color || '#374151', size: 24, linkPageId: '',
        isActive: false, activeColor: '#3b82f6',
        effectColor: true, effectUnderline: false, effectStroke: false
      };
    }

    // ========== 组件定义（默认无多余字样） ==========
    var COMPONENT_DEFS = [

      { type: 'icon-cart', name: '购物车', category: 'icons',
        defaults: defaultIconProps('#374151','cart'),
        render: function(p) { return renderIconWithEffect(p, p.icon||'cart'); }},
      { type: 'icon-heart', name: '收藏', category: 'icons',
        defaults: defaultIconProps('#ef4444','heart'),
        render: function(p) { return renderIconWithEffect(p, p.icon||'heart'); }},
      { type: 'icon-search', name: '搜索图标', category: 'icons',
        defaults: defaultIconProps('#6b7280','search'),
        render: function(p) { return renderIconWithEffect(p, p.icon||'search'); }},
      { type: 'icon-user', name: '用户', category: 'icons',
        defaults: defaultIconProps('#374151','user'),
        render: function(p) { return renderIconWithEffect(p, p.icon||'user'); }},
      { type: 'icon-home', name: '首页图标', category: 'icons',
        defaults: defaultIconProps('#3b82f6','home'),
        render: function(p) { return renderIconWithEffect(p, p.icon||'home'); }},
      { type: 'icon-grid', name: '分类图标', category: 'icons',
        defaults: defaultIconProps('#374151','grid'),
        render: function(p) { return renderIconWithEffect(p, p.icon||'grid'); }},
      { type: 'icon-share', name: '分享', category: 'icons',
        defaults: defaultIconProps('#374151','share'),
        render: function(p) { return renderIconWithEffect(p, p.icon||'share'); }},
      { type: 'icon-msg', name: '消息', category: 'icons',
        defaults: defaultIconProps('#3b82f6','msg'),
        render: function(p) { return renderIconWithEffect(p, p.icon||'msg'); }},
      { type: 'icon-loc', name: '定位', category: 'icons',
        defaults: defaultIconProps('#ef4444','loc'),
        render: function(p) { return renderIconWithEffect(p, p.icon||'loc'); }},
      { type: 'icon-bell', name: '通知', category: 'icons',
        defaults: defaultIconProps('#f59e0b','bell'),
        render: function(p) { return renderIconWithEffect(p, p.icon||'bell'); }},
      { type: 'icon-bag', name: '购物袋', category: 'icons',
        defaults: defaultIconProps('#374151','bag'),
        render: function(p) { return renderIconWithEffect(p, p.icon||'bag'); }},
      { type: 'icon-gift', name: '礼盒', category: 'icons',
        defaults: defaultIconProps('#ec4899','gift'),
        render: function(p) { return renderIconWithEffect(p, p.icon||'gift'); }},
      { type: 'icon-camera', name: '相机', category: 'icons',
        defaults: defaultIconProps('#6b7280','camera'),
        render: function(p) { return renderIconWithEffect(p, p.icon||'camera'); }},
      { type: 'icon-filter', name: '筛选', category: 'icons',
        defaults: defaultIconProps('#374151','filter'),
        render: function(p) { return renderIconWithEffect(p, p.icon||'filter'); }},
      { type: 'icon-star', name: '星标', category: 'icons',
        defaults: defaultIconProps('#f59e0b','star'),
        render: function(p) { return renderIconWithEffect(p, p.icon||'star'); }},
      { type: 'icon-check', name: '勾选', category: 'icons',
        defaults: defaultIconProps('#22c55e','check'),
        render: function(p) { return renderIconWithEffect(p, p.icon||'check'); }},
      { type: 'icon-plus', name: '加号', category: 'icons',
        defaults: defaultIconProps('#3b82f6','plus'),
        render: function(p) { return renderIconWithEffect(p, p.icon||'plus'); }},
      { type: 'icon-custom', name: '任意图标', category: 'icons',
        defaults: defaultIconProps('#374151','home'),
        render: function(p) { return renderIconWithEffect(p, p.icon||'home'); }},

      { type: 'nav-top', name: '顶部导航', category: 'nav',
        defaults: {
          bgColor: '#ffffff', textColor: '#111827', height: 48,
          items: [
            { kind: 'text', text: 'Shop', page: '' },
            { kind: 'text', text: '首页', page: '' },
            { kind: 'text', text: '分类', page: '' },
            { kind: 'icon', icon: 'search', page: '' },
            { kind: 'icon', icon: 'cart', page: '' }
          ]
        },
        render: function(p) {
          var items = p.items || [];
          var left = '', right = '';
          for (var i=0;i<items.length;i++) {
            var it = items[i];
            var bit = '';
            if (it.kind === 'icon' && ICONS[it.icon]) {
              bit = '<span data-role="link" data-page="'+esc(it.page||'')+'" style="display:inline-flex;color:'+p.textColor+';padding:4px 6px;cursor:pointer;">'+iconS(ICONS[it.icon],18)+'</span>';
              right += bit;
            } else {
              bit = '<span data-role="link" data-page="'+esc(it.page||'')+'" style="color:'+p.textColor+';font-size:'+(i===0?17:13)+'px;font-weight:'+(i===0?700:500)+';padding:4px 8px;cursor:pointer;text-decoration:none;">'+esc(it.text||'')+'</span>';
              left += bit;
            }
          }
          return '<nav style="display:flex;align-items:center;justify-content:space-between;padding:0 8px;height:'+(p.height||48)+'px;background:'+p.bgColor+';border-bottom:1px solid #eee;font-family:system-ui,sans-serif;">'+
            '<div style="display:flex;align-items:center;gap:2px;overflow:hidden;">'+left+'</div>'+
            '<div style="display:flex;align-items:center;gap:2px;flex-shrink:0;">'+right+'</div></nav>';
        }},
      { type: 'nav-bottom', name: '底部导航', category: 'nav',
        defaults: {
          bgColor: '#ffffff', activeColor: '#3b82f6', inactiveColor: '#9ca3af', height: 56,
          activeIndex: 0,
          effectColor: true, effectUnderline: true, effectStroke: false,
          items: [
            { kind: 'icon', icon: 'home', text: '首页', page: '' },
            { kind: 'icon', icon: 'grid', text: '分类', page: '' },
            { kind: 'icon', icon: 'cart', text: '购物车', page: '' },
            { kind: 'icon', icon: 'user', text: '我的', page: '' }
          ]
        },
        render: function(p) {
          var items = p.items || [];
          var activeIndex = parseInt(p.activeIndex,10); if (isNaN(activeIndex)) activeIndex = 0;
          var html = '';
          for (var i=0;i<items.length;i++) {
            var it = items[i];
            var on = i === activeIndex;
            var c = on && p.effectColor !== false ? p.activeColor : p.inactiveColor;
            var ic = (it.icon && ICONS[it.icon]) ? iconS(ICONS[it.icon],20) : '';
            var cls = 'tab-fx';
            if (on && p.effectUnderline) cls += ' fx-underline';
            if (on && p.effectStroke) cls += ' fx-stroke';
            html += '<a href="javascript:void(0)" class="'+cls+'" data-role="link" data-page="'+esc(it.page||'')+'" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:'+c+';font-size:10px;height:100%;padding:6px 2px;box-sizing:border-box;">'+
              ic+'<span style="max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(it.text||'')+'</span></a>';
          }
          return '<nav style="display:flex;background:'+p.bgColor+';border-top:1px solid #eee;height:'+(p.height||56)+'px;font-family:system-ui,sans-serif;">'+html+'</nav>';
        }},
      { type: 'nav-back', name: '返回顶栏', category: 'nav',
        defaults: {
          bgColor: '#ffffff', textColor: '#111827', height: 44,
          items: [
            { kind: 'icon', icon: 'back', text: '', page: '' },
            { kind: 'text', text: '', page: '' }
          ]
        },
        render: function(p) {
          var items = p.items || [];
          var back = items[0] || { kind:'icon', icon:'back', page:'' };
          var title = items[1] || { kind:'text', text:'', page:'' };
          return '<div style="display:flex;align-items:center;height:'+(p.height||44)+'px;padding:0 8px;background:'+p.bgColor+';border-bottom:1px solid #eee;font-family:system-ui,sans-serif;">'+
            '<span data-role="link" data-page="'+esc(back.page||'')+'" style="display:flex;align-items:center;color:'+p.textColor+';cursor:pointer;padding:6px;">'+iconS(ICONS[back.icon]||ICONS.back,20)+'</span>'+
            '<span data-role="link" data-page="'+esc(title.page||'')+'" style="flex:1;text-align:center;font-size:15px;font-weight:600;color:'+p.textColor+';margin-right:28px;">'+esc(title.text||'')+'</span></div>';
        }},

      { type: 'btn-primary', name: '主按钮', category: 'btn',
        defaults: { text: '立即购买', bgColor: '#ef4444', textColor: '#ffffff', radius: 22, height: 44, linkPageId: '' },
        render: function(p) {

          var list = String(p.tabs||'').split(/[,，]/).filter(Boolean);
          var activeIndex = parseInt(p.activeIndex,10); if (isNaN(activeIndex)) activeIndex = 0;
          var h = '<div style="display:flex;background:#fff;border-bottom:1px solid #f3f4f6;font-family:system-ui,sans-serif;">';
          for (var i=0;i<list.length;i++) {
            var on = i === activeIndex;
            var c = on && p.effectColor !== false ? p.activeColor : '#6b7280';
            var cls = 'tab-fx';
            if (on && p.effectUnderline) cls += ' fx-underline';
            if (on && p.effectStroke) cls += ' fx-stroke';
            h += '<div class="'+cls+'" style="flex:1;text-align:center;padding:12px 0;font-size:14px;color:'+c+';font-weight:'+(on?600:400)+';">'+esc(list[i])+'</div>';
          }
          return h + '</div>';
        }},
      { type: 'address-bar', name: '收货地址', category: 'ecom',
        defaults: { text: '配送至 北京市朝阳区', linkPageId: '' },
        render: function(p) {
          return '<div data-role="tap" data-page="'+esc(p.linkPageId)+'" style="padding:10px 14px;background:#fff;font-size:13px;color:#374151;font-family:system-ui,sans-serif;cursor:pointer;">📍 '+esc(p.text)+' ›</div>';
        }},
      { type: 'recommend-title', name: '猜你喜欢', category: 'ecom',
        defaults: { title: '猜你喜欢', color: '#111827' },
        render: function(p) {
          return '<div style="padding:14px;text-align:center;font-size:14px;font-weight:600;color:'+p.color+';font-family:system-ui,sans-serif;">— '+esc(p.title)+' —</div>';
        }},

    ];

    var CATEGORIES = [
      { id: 'icons', label: '图标' },
      { id: 'nav', label: '导航' },
      { id: 'btn', label: '按钮' },
      { id: 'ecom', label: '电商' },
    ];
    var COLOR_PRESETS = ['#ef4444','#f59e0b','#22c55e','#3b82f6','#8b5cf6','#ec4899','#111827','#6b7280','#ffffff','#f3f4f6'];
    var STORAGE_KEY = 'diy-builder-v4';

    var projects = {};
    var currentProjectId = null;
    var currentPageId = null;
    var selectedId = null;
    var selectedSlot = null; // 导航内部子项，如 tab1 / menu1 / logo
    var currentTab = 'ecom';
    var previewMode = false;
    var dragType = null;
    var searchFilter = '';
    var confirmCallback = null;

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function uid(prefix) { return (prefix||'el') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
    function toast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function(){ t.classList.remove('show'); }, 2000);
    }
    function getDef(type) {
      for (var i=0;i<COMPONENT_DEFS.length;i++) if (COMPONENT_DEFS[i].type===type) return COMPONENT_DEFS[i];
      return null;
    }
    function getProject() { return projects[currentProjectId] || null; }
    function getPage() {
      var p = getProject();
      if (!p || !p.pages) return null;
      for (var i=0;i<p.pages.length;i++) if (p.pages[i].id===currentPageId) return p.pages[i];
      return p.pages[0] || null;
    }
    function getElements() {
      var page = getPage();
      return page ? page.elements : [];
    }
    function setElements(els) {
      var page = getPage();
      if (page) page.elements = els;
    }

    // ========== 弹窗 ==========
    function showModal(id) { var el = document.getElementById(id); if (el) el.classList.add('show'); else console.error('modal missing', id); }
    function hideModal(id) { var el = document.getElementById(id); if (el) el.classList.remove('show'); }

    function openCreateModal() {
      document.getElementById('createTitle').value = '';
      showModal('createModal');
      setTimeout(function(){ document.getElementById('createTitle').focus(); }, 100);
    }
    function confirmCreate() {
      var title = document.getElementById('createTitle').value.trim() || '未命名项目';
      hideModal('createModal');
      var id = uid('p');
      var pageId = uid('page');
      currentProjectId = id;
      currentPageId = pageId;
      selectedId = null;
      previewMode = false;
      projects[id] = {
        id: id,
        title: title,
        pages: [{ id: pageId, name: '首页', elements: [] }],
        updated_at: new Date().toISOString(),
        created_at: new Date().toISOString()
      };
      persist();
      document.getElementById('editorTitle').textContent = title;
      document.getElementById('saveStatus').textContent = '';
      showEditor();
      renderAll();
      toast('已创建，开始搭建');
    }

    function showConfirm(title, msg, onOk) {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMsg').textContent = msg;
      confirmCallback = onOk;
      document.getElementById('confirmOkBtn').onclick = function() {
        hideModal('confirmModal');
        if (confirmCallback) confirmCallback();
        confirmCallback = null;
      };
      showModal('confirmModal');
    }
    function showAlert(title, msg) {
      document.getElementById('alertTitle').textContent = title || '提示';
      document.getElementById('alertMsg').textContent = msg;
      showModal('alertModal');
    }

    function openClearModal() {
      showConfirm('清空本页', '确定清空当前页面的所有组件？', function() {
        setElements([]);
        selectedId = null;
        renderCanvas();
        renderProps();
      });
    }

    // ========== 存储 ==========
    function loadProjects() {
      try { projects = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { projects = {}; }
    }
    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
    }

    // ========== 导航 ==========
    function showHome() {
      document.getElementById('homeView').style.display = 'flex';
      document.getElementById('editorView').classList.remove('show');
      previewMode = false;
    }
    function showEditor() {
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('editorView').classList.add('show');
    }
    function backToHome() {
      if (getElements().length) {
        showConfirm('返回首页', '未保存的修改可能丢失，确定返回？', function(){ showHome(); });
      } else {
        showHome();
      }
    }

    function openProject(id) {
      var p = projects[id];
      if (!p) return;
      // 兼容旧数据
      if (!p.pages) {
        p.pages = [{ id: uid('page'), name: '首页', elements: p.elements || [] }];
        delete p.elements;
      }
      currentProjectId = id;
      currentPageId = p.pages[0].id;
      selectedId = null;
      previewMode = false;
      document.getElementById('editorTitle').textContent = p.title;
      hideModal('projectsModal');
      showEditor();
      renderAll();
      toast('已打开：' + p.title);
    }

    function saveProject() {
      if (!currentProjectId) return;
      var p = getProject();
      p.updated_at = new Date().toISOString();
      persist();
      document.getElementById('saveStatus').textContent = '已保存';
      toast('已保存');
      var html = generateFullHTML();
      fetch('/api/projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: currentProjectId, title: p.title, html: html })
      }).catch(function(){});
    }

    function deleteProject(id, e) {
      e.stopPropagation();
      showConfirm('删除项目', '确定删除该项目？此操作不可恢复。', function() {
        delete projects[id];
        persist();
        renderProjectsList();
        if (currentProjectId === id) { currentProjectId = null; showHome(); }
        toast('已删除');
      });
    }

    function showProjectsModal() {
      loadProjects();
      renderProjectsList();
      showModal('projectsModal');
    }
    function renderProjectsList() {
      var list = Object.keys(projects).map(function(k){ return projects[k]; })
        .sort(function(a,b){ return new Date(b.updated_at)-new Date(a.updated_at); });
      var el = document.getElementById('projectsList');
      if (!list.length) {
        el.innerHTML = '<div class="empty-projects">暂无项目</div>';
        return;
      }
      el.innerHTML = list.map(function(p) {
        var pageCount = (p.pages && p.pages.length) || 1;
        var elCount = 0;
        if (p.pages) p.pages.forEach(function(pg){ elCount += (pg.elements||[]).length; });
        else elCount = (p.elements||[]).length;
        return '<div class="project-item" onclick="openProject(\''+p.id+'\')">'+
          '<div class="info"><div class="title">'+esc(p.title)+'</div>'+
          '<div class="meta">'+pageCount+' 页 · '+elCount+' 组件 · '+new Date(p.updated_at).toLocaleString()+'</div></div>'+
          '<button class="del-btn" onclick="deleteProject(\''+p.id+'\',event)">🗑</button></div>';
      }).join('');
    }

    // ========== 多页面 ==========
    function renderPagesBar() {
      var p = getProject();
      var bar = document.getElementById('pagesBar');
      if (!p || !p.pages) { bar.innerHTML = ''; return; }
      bar.innerHTML = p.pages.map(function(pg) {
        return '<button class="page-tab '+(pg.id===currentPageId?'active':'')+'" onclick="switchPage(\''+pg.id+'\')">'+esc(pg.name)+'</button>';
      }).join('') +
        '<button class="page-add" onclick="openNewPageModal()">+ 新页面</button>';
    }
    function switchPage(pageId) {
      currentPageId = pageId;
      selectedId = null;
      searchFilter = '';
      renderPagesBar();
      renderCanvas();
      renderProps();
    }
    function openNewPageModal() {
      document.getElementById('newPageName').value = '';
      showModal('newPageModal');
      setTimeout(function(){ document.getElementById('newPageName').focus(); }, 100);
    }
    function confirmAddPage() {
      var name = document.getElementById('newPageName').value.trim() || '新页面';
      hideModal('newPageModal');
      var p = getProject();
      var pageId = uid('page');
      p.pages.push({ id: pageId, name: name, elements: [] });
      currentPageId = pageId;
      selectedId = null;
      persist();
      renderPagesBar();
      renderCanvas();
      renderProps();
      toast('已添加页面：' + name);
    }

    // ========== 组件库 ==========
    function renderPalette() {
      var tabs = document.getElementById('paletteTabs');
      tabs.innerHTML = CATEGORIES.map(function(c) {
        return '<button class="sheet-tab '+(c.id===currentTab?'active':'')+'" onclick="switchTab(\''+c.id+'\')">'+c.label+'</button>';
      }).join('');
      var list = document.getElementById('paletteList');
      var comps = COMPONENT_DEFS.filter(function(d){ return d.category===currentTab; });
      list.innerHTML = '<div class="comp-grid">' +
        comps.map(function(d) {
          return '<div class="comp-card" draggable="true" ondragstart="onDragStart(event,\''+d.type+'\')" onclick="addComponent(\''+d.type+'\')">'+
            '<div class="comp-preview">'+d.render(d.defaults, {preview:false})+'</div>'+
            '<div class="comp-name">'+esc(d.name)+'</div></div>';
        }).join('') + '</div>';
    }
    function switchTab(id) { currentTab = id; renderPalette(); }

    function addComponent(type, atX, atY) {
      if (previewMode) { toast('请先退出预览模式'); return; }
      var def = getDef(type);
      if (!def) return;
      var els = getElements();
      var isIcon = def.category === 'icons' || type === 'float-btn';
      var el = {
        id: uid('el'),
        type: type,
        props: JSON.parse(JSON.stringify(def.defaults)),
        scale: 1,
        layout: isIcon ? 'free' : 'flow',
        x: typeof atX === 'number' ? atX : (isIcon ? 40 + (els.length % 5) * 24 : 0),
        y: typeof atY === 'number' ? atY : (isIcon ? 80 + Math.floor(els.length / 5) * 24 : 0),
        pin: (type === 'nav-bottom' || type === 'buy-bar') ? 'bottom' : (type === 'nav-top' || type === 'nav-back' ? 'top' : '')
      };
      els.push(el);
      setElements(els);
      selectedId = el.id;
      selectedSlot = null;
      renderCanvas();
      renderProps();
      showSheetProps();
      toast(isIcon ? '已添加（可拖动位置）' : '已添加');
    }
    function onDragStart(e, type) {
      dragType = type;
      e.dataTransfer.setData('text/plain', type);
      e.dataTransfer.effectAllowed = 'copy';
    }
    function setupDrop() {
      var zone = document.getElementById('dropZone');
      var screen = document.getElementById('phoneScreen');
      screen.addEventListener('dragover', function(e){ e.preventDefault(); if(!previewMode) zone.classList.add('drag-over'); });
      screen.addEventListener('dragleave', function(e){ if (!screen.contains(e.relatedTarget)) zone.classList.remove('drag-over'); });
      screen.addEventListener('drop', function(e){
        e.preventDefault();
        zone.classList.remove('drag-over');
        if (previewMode) return;
        var type = e.dataTransfer.getData('text/plain') || dragType;
        if (type) {
          var rect = zone.getBoundingClientRect();
          var x = e.clientX - rect.left + zone.scrollLeft;
          var y = e.clientY - rect.top + zone.scrollTop;
          addComponent(type, Math.max(0, x - 20), Math.max(0, y - 20));
        }
        dragType = null;
      });
    }

    // ========== 画布渲染 ==========
    function elStyle(el) {
      var sc = (el.scale != null ? el.scale : 1);
      var st = 'transform:scale('+sc+');transform-origin:top left;';
      if (el.layout === 'free' && !el.pin) {
        st += 'position:absolute;left:'+(el.x||0)+'px;top:'+(el.y||0)+'px;';
      }
      return st;
    }
    function elClass(el) {
      var c = 'canvas-el';
      if (el.id === selectedId) c += ' selected';
      if (el.layout === 'free' && !el.pin) c += ' layout-free';
      if (el.pin === 'top') c += ' pin-top';
      if (el.pin === 'bottom') c += ' pin-bottom';
      return c;
    }
    function renderOneEl(el, ctx, editable) {
      var def = getDef(el.type);
      if (!def) return '';
      var sc = (el.scale != null ? el.scale : 1);
      if (!editable) {
        return '<div class="'+elClass(el)+'" data-id="'+el.id+'" style="'+elStyle(el)+'">'+def.render(el.props, ctx)+'</div>';
      }
      var linkLabel = getLinkLabel(el);
      var badges = '';
      if (el.layout === 'free') badges += '<span class="free-badge">自由</span>';
      if (el.pin) badges += '<span class="pin-badge">固定'+(el.pin==='top'?'顶':'底')+'</span>';
      return '<div class="'+elClass(el)+'" data-id="'+el.id+'" onclick="selectEl(\''+el.id+'\',event)" style="'+elStyle(el)+'">'+
        '<div class="el-actions">'+
          '<button type="button" onclick="moveEl(\''+el.id+'\',-1,event)" title="上移">↑</button>'+
          '<button type="button" onclick="moveEl(\''+el.id+'\',1,event)" title="下移">↓</button>'+
          '<button type="button" class="btn-del" onclick="removeEl(\''+el.id+'\',event)">×</button>'+
        '</div>'+
        badges+
        (linkLabel ? '<span class="link-badge">→ '+esc(linkLabel)+'</span>' : '')+
        '<span class="resize-handle tl" data-resize="'+el.id+'"></span>'+
        '<span class="resize-handle tr" data-resize="'+el.id+'"></span>'+
        '<span class="resize-handle bl" data-resize="'+el.id+'"></span>'+
        '<span class="resize-handle br" data-resize="'+el.id+'"></span>'+
        '<span class="scale-tag">'+Math.round(sc*100)+'%</span>'+
        def.render(el.props, ctx)+'</div>';
    }

    function renderCanvas() {
      var zone = document.getElementById('dropZone');
      var els = getElements();
      var ctx = { preview: previewMode, selectedSlot: selectedSlot };

      var list = els;
      if (previewMode && searchFilter) {
        list = els.filter(function(el) {
          if (el.type === 'product-card' || el.type === 'product-list' || el.type === 'product-grid') {
            var name = (el.props.name || '').toLowerCase();
            return !searchFilter || name.indexOf(searchFilter.toLowerCase()) >= 0;
          }
          return true;
        });
      }

      if (!els.length) {
        zone.innerHTML = '<div class="empty-hint"><div style="font-size:28px;opacity:.35;">↓</div><div>拖入组件到这里</div><div style="font-size:11px;opacity:.7;">图标支持自由拖放位置</div></div>';
        return;
      }

      // 分层：顶固定 / 流式+自由 / 底固定
      var top = [], mid = [], bot = [];
      for (var i=0;i<list.length;i++) {
        var el = list[i];
        if (el.pin === 'top') top.push(el);
        else if (el.pin === 'bottom') bot.push(el);
        else mid.push(el);
      }

      var editable = !previewMode;
      var html = '';
      if (top.length) {
        html += '<div class="pin-layer top">'+top.map(function(el){ return renderOneEl(el, ctx, editable); }).join('')+'</div>';
      }
      // mid needs min height so free items show
      var freeMaxY = 400;
      mid.forEach(function(el) {
        if (el.layout === 'free') freeMaxY = Math.max(freeMaxY, (el.y||0) + 80);
      });
      html += '<div class="canvas-mid" style="position:relative;min-height:'+freeMaxY+'px;padding-top:'+(top.length?0:0)+'px;padding-bottom:'+(bot.length?56:0)+'px;">';
      html += mid.map(function(el){ return renderOneEl(el, ctx, editable); }).join('');
      html += '</div>';
      if (bot.length) {
        html += '<div class="pin-layer bottom">'+bot.map(function(el){ return renderOneEl(el, ctx, editable); }).join('')+'</div>';
      }

      zone.innerHTML = html;
      if (previewMode) bindPreviewEvents(zone);
      else {
        bindResizeHandles();
        bindFreeDrag();
      }
    }

    function getLinkLabel(el) {
      var p = el.props;
      var ids = [p.linkPageId, p.menu1Page, p.menu2Page, p.cartPage, p.page1, p.page2, p.page3, p.page4, p.backPage, p.morePage];
      if (p.items && p.items.length) {
        for (var ii=0;ii<p.items.length;ii++) if (p.items[ii].page) ids.push(p.items[ii].page);
      }
      var proj = getProject();
      if (!proj) return '';
      for (var i=0;i<ids.length;i++) {
        if (ids[i]) {
          for (var j=0;j<proj.pages.length;j++) {
            if (proj.pages[j].id === ids[i]) return proj.pages[j].name;
          }
        }
      }
      return '';
    }

    function bindPreviewEvents(zone) {
      // 搜索
      var inputs = zone.querySelectorAll('[data-role="search"]');
      for (var i=0;i<inputs.length;i++) {
        inputs[i].addEventListener('input', function(e) {
          searchFilter = e.target.value;
          renderCanvas();
          // 恢复焦点与内容
          var again = document.querySelector('[data-role="search"]');
          if (again) { again.value = searchFilter; again.focus(); }
        });
      }
      // 跳转
      zone.addEventListener('click', function(e) {
        var target = e.target.closest('[data-page]');
        if (!target) target = e.target.closest('[data-role="tap"],[data-role="link"]');
        if (!target) return;
        var pageId = target.getAttribute('data-page');
        if (pageId) {
          e.preventDefault();
          e.stopPropagation();
          navigateToPage(pageId);
        }
      });
    }

    function navigateToPage(pageId) {
      var p = getProject();
      if (!p) return;
      var found = false;
      for (var i=0;i<p.pages.length;i++) {
        if (p.pages[i].id === pageId) { found = true; break; }
      }
      if (!found) {
        toast('未设置跳转页面');
        return;
      }
      searchFilter = '';
      currentPageId = pageId;
      renderPagesBar();
      renderCanvas();
      toast('进入：' + (function(){
        for (var i=0;i<p.pages.length;i++) if (p.pages[i].id===pageId) return p.pages[i].name;
        return '';
      })());
    }


    function ensureNavProps(el) {
      if (!el || !el.props) return;
      if (el.type === 'nav-bottom') {
        if (!el.props.icon1) el.props.icon1 = 'home';
        if (!el.props.icon2) el.props.icon2 = 'grid';
        if (!el.props.icon3) el.props.icon3 = 'cart';
        if (!el.props.icon4) el.props.icon4 = 'user';
      }
      if (el.type === 'nav-top') {
        if (el.props.right1Icon === undefined) el.props.right1Icon = 'search';
        if (el.props.right2Icon === undefined) el.props.right2Icon = 'cart';
        if (el.props.cartPage && !el.props.right2Page) el.props.right2Page = el.props.cartPage;
      }
      if (el.type === 'nav-back') {
        if (!el.props.backIcon) el.props.backIcon = 'back';
      }
    }


    var resizingId = null;
    var resizeStartY = 0;
    var resizeStartScale = 1;

    function bindResizeHandles() {
      var handles = document.querySelectorAll('.resize-handle');
      for (var i=0;i<handles.length;i++) {
        handles[i].addEventListener('pointerdown', onResizeStart);
      }
    }
    function onResizeStart(e) {
      e.preventDefault();
      e.stopPropagation();
      var id = e.currentTarget.getAttribute('data-resize');
      if (!id) return;
      resizingId = id;
      resizeStartY = e.clientY;
      var els = getElements();
      resizeStartScale = 1;
      for (var i=0;i<els.length;i++) {
        if (els[i].id === id) {
          resizeStartScale = els[i].scale != null ? els[i].scale : 1;
          break;
        }
      }
      selectedId = id;
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch(err) {}
      document.addEventListener('pointermove', onResizeMove);
      document.addEventListener('pointerup', onResizeEnd);
      document.addEventListener('pointercancel', onResizeEnd);
    }
    function onResizeMove(e) {
      if (!resizingId) return;
      var dy = e.clientY - resizeStartY;
      // 向下拖放大，向上拖缩小
      var next = resizeStartScale + dy / 120;
      if (next < 0.4) next = 0.4;
      if (next > 2.5) next = 2.5;
      next = Math.round(next * 20) / 20;
      setElementScale(resizingId, next);
    }
    function onResizeEnd() {
      resizingId = null;
      document.removeEventListener('pointermove', onResizeMove);
      document.removeEventListener('pointerup', onResizeEnd);
      document.removeEventListener('pointercancel', onResizeEnd);
      renderProps();
    }
    function setElementScale(id, scale) {
      var els = getElements();
      for (var i=0;i<els.length;i++) {
        if (els[i].id === id) {
          els[i].scale = scale;
          break;
        }
      }
      // 只更新 DOM 上的 transform，避免整表重绘打断拖拽
      var node = document.querySelector('.canvas-el[data-id="'+id+'"]');
      if (node) {
        node.style.transform = 'scale('+scale+')';
        var tag = node.querySelector('.scale-tag');
        if (tag) tag.textContent = Math.round(scale*100)+'%';
      }
    }



    var movingId = null;
    var moveOffX = 0, moveOffY = 0;

    function bindFreeDrag() {
      var nodes = document.querySelectorAll('.canvas-el.layout-free');
      for (var i=0;i<nodes.length;i++) {
        nodes[i].addEventListener('pointerdown', onFreePointerDown);
      }
    }
    function onFreePointerDown(e) {
      if (previewMode) return;
      if (e.target.closest && (e.target.closest('.resize-handle') || e.target.closest('.el-actions'))) return;
      var node = e.currentTarget;
      var id = node.getAttribute('data-id');
      var el = null;
      var els = getElements();
      for (var i=0;i<els.length;i++) if (els[i].id === id) { el = els[i]; break; }
      if (!el || el.layout !== 'free' || el.pin) return;
      movingId = id;
      selectedId = id;
      var rect = node.getBoundingClientRect();
      moveOffX = e.clientX - rect.left;
      moveOffY = e.clientY - rect.top;
      try { node.setPointerCapture(e.pointerId); } catch(err) {}
      document.addEventListener('pointermove', onFreePointerMove);
      document.addEventListener('pointerup', onFreePointerUp);
      document.addEventListener('pointercancel', onFreePointerUp);
      e.preventDefault();
    }
    function onFreePointerMove(e) {
      if (!movingId) return;
      var zone = document.getElementById('dropZone');
      var rect = zone.getBoundingClientRect();
      var x = e.clientX - rect.left + zone.scrollLeft - moveOffX;
      var y = e.clientY - rect.top + zone.scrollTop - moveOffY;
      if (x < 0) x = 0;
      if (y < 0) y = 0;
      var maxX = zone.clientWidth - 40;
      if (x > maxX) x = maxX;
      setElementPos(movingId, Math.round(x), Math.round(y));
    }
    function onFreePointerUp() {
      movingId = null;
      document.removeEventListener('pointermove', onFreePointerMove);
      document.removeEventListener('pointerup', onFreePointerUp);
      document.removeEventListener('pointercancel', onFreePointerUp);
      renderProps();
    }
    function setElementPos(id, x, y) {
      var els = getElements();
      for (var i=0;i<els.length;i++) {
        if (els[i].id === id) {
          els[i].x = x;
          els[i].y = y;
          els[i].layout = 'free';
          break;
        }
      }
      var node = document.querySelector('.canvas-el[data-id="'+id+'"]');
      if (node) {
        node.style.left = x + 'px';
        node.style.top = y + 'px';
        node.style.position = 'absolute';
      }
    }
    function setElementLayout(layout) {
      var els = getElements();
      for (var i=0;i<els.length;i++) {
        if (els[i].id === selectedId) {
          els[i].layout = layout;
          if (layout === 'free' && els[i].x == null) {
            els[i].x = 20;
            els[i].y = 100;
          }
          if (layout === 'flow') {
            // keep x,y but unused
          }
          break;
        }
      }
      renderCanvas();
      renderProps();
    }
    function setElementPin(pin) {
      var els = getElements();
      for (var i=0;i<els.length;i++) {
        if (els[i].id === selectedId) {
          els[i].pin = pin || '';
          if (pin) els[i].layout = 'flow';
          break;
        }
      }
      renderCanvas();
      renderProps();
      toast(pin ? ('已固定到屏幕' + (pin==='top'?'顶部':'底部')) : '已取消固定');
    }


    function selectEl(id, e) {
      if (previewMode) return;
      if (e) e.stopPropagation();
      selectedId = id;
      selectedSlot = null;
      var _els = getElements();
      for (var _i=0;_i<_els.length;_i++) if (_els[_i].id===id) ensureNavProps(_els[_i]);
      renderCanvas();
      renderProps();

    function selectSlot(slot) {
      if (previewMode) return;
      selectedSlot = slot;
      renderCanvas();
      renderProps();
      showSheetProps();
      // 半窗滚到对应 slot 卡片
      setTimeout(function(){

    function removeEl(id, e) {
      e.stopPropagation();
      var els = getElements().filter(function(el){ return el.id !== id; });
      setElements(els);
      if (selectedId === id) selectedId = null;
      renderCanvas();
      renderProps();
    }
    function moveEl(id, dir, e) {
      e.stopPropagation();
      var els = getElements().slice();
      var idx = -1;
      for (var i=0;i<els.length;i++) if (els[i].id===id) { idx=i; break; }
      if (idx < 0) return;
      var ni = idx + dir;
      if (ni < 0 || ni >= els.length) return;
      var t = els[idx]; els[idx] = els[ni]; els[ni] = t;
      setElements(els);
      renderCanvas();
    }

    // ========== 属性面板 ==========
    var ICON_PICK_KEYS = ['home','grid','cart','user','search','heart','star','share','msg','loc','bell','bag','gift','camera','filter','check','back','plus'];

        h += '<button type="button" style="width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:#1e293b;color:#e2e8f0;display:flex;align-items:center;justify-content:center;padding:0;'+act+'" onclick="updateNavItem('+itemIndex+',\'icon\',\''+k+'\')">'+iconS(ICONS[k],18)+'</button>';
      }
      return h + '</div>';
    }

    function pageSelectHtml(val, onchangeCode) {
      var proj = getProject();
      var h = '<select onchange="'+onchangeCode+'" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:#0f172a;color:var(--text);"><option value="">不跳转</option>';

    function ensureItems(el) {
      if (!el.props.items) {
        var def = getDef(el.type);
        el.props.items = def && def.defaults.items ? JSON.parse(JSON.stringify(def.defaults.items)) : [];
      }
      return el.props.items;
    }

    function renderNavItemsEditor(el) {
      var items = ensureItems(el);
      var h = '<p style="font-size:12px;color:var(--muted);margin-bottom:10px;">可添加文字或图标，每一项都能设置跳转页面</p>';

      h += '<button type="button" class="btn-primary" onclick="addNavItem(\'text\')">+ 添加文字</button>';
      h += '<button type="button" class="btn-secondary" onclick="addNavItem(\'icon\')">+ 添加图标</button>';
      h += '</div>';
      for (var i=0;i<items.length;i++) {
        var it = items[i];
        h += '<div class="nav-item-row">';
        h += '<span style="font-size:11px;color:var(--muted);width:100%;">第 '+(i+1)+' 项 · '+(it.kind==='icon'?'图标':'文字')+'</span>';
        if (it.kind === 'icon') {
          h += '<div style="width:100%;"><label style="font-size:11px;color:var(--muted);">选择图标</label>'+iconPickerHtml(it.icon||'home', i)+'</div>';

        } else {
          h += '<div style="width:100%;"><label style="font-size:11px;color:var(--muted);">文字</label><input type="text" value="'+esc(it.text||'')+'" onchange="updateNavItem('+i+',\'text\',this.value)" placeholder="输入文字"></div>';

    function addNavItem(kind) {

          ensureItems(els[i]);

        }
      }
      renderCanvas();
      renderProps();
    }
    function updateNavItem(index, field, value) {
      var els = getElements();
      for (var i=0;i<els.length;i++) {
        if (els[i].id === selectedId) {
          var items = ensureItems(els[i]);
          if (items[index]) items[index][field] = value;
          break;
        }
      }
      renderCanvas();
      if (field === 'icon') renderProps();

    function removeNavItem(index) {
      var els = getElements();
      for (var i=0;i<els.length;i++) {
        if (els[i].id === selectedId) {
          ensureItems(els[i]).splice(index, 1);

      if (isIcon) {
        h += '<div style="margin-top:8px;"><label style="font-size:11px;color:var(--muted);">换成任意图标</label>';
        h += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">';
        var keys = ICON_PICK_KEYS || [];
        for (var i=0;i<keys.length;i++) {
          var k = keys[i];
          if (!ICONS[k]) continue;
          var act = (props.icon===k || (!props.icon && false)) ? 'border-color:#3b82f6;background:#1e3a5f;' : '';
          h += '<button type="button" style="width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:#1e293b;color:#e2e8f0;display:flex;align-items:center;justify-content:center;padding:0;'+act+'" onclick="updateProp(\'icon\',\''+k+'\')">'+iconS(ICONS[k],18)+'</button>';

      } else {

      h += '<div class="prop-group"><label>效果开关</label>';

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自主 DIY 网页平台 · 组件化搭建</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0f172a;
      color: #e2e8f0;
      overflow: hidden;
    }
    header {
      background: #1e293b;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    header h1 { font-size: 17px; font-weight: 600; white-space: nowrap; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button, .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover, .btn:hover { background: #2563eb; }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #64748b; }
    button.success { background: #16a34a; }
    button.success:hover { background: #15803d; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { font-size: 12px; color: #64748b; }

    .main { flex: 1; display: flex; overflow: hidden; }

    /* 左侧组件库 */
    .component-panel {
      width: 280px;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .panel-tabs {
      display: flex;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }
    .panel-tab {
      flex: 1;
      padding: 10px 4px;
      text-align: center;
      font-size: 12px;
      cursor: pointer;
      color: #94a3b8;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .panel-tab:hover { color: #e2e8f0; background: #334155; }
    .panel-tab.active { color: #60a5fa; border-bottom-color: #3b82f6; }
    .component-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .comp-category { margin-bottom: 16px; }
    .comp-category-title {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      padding-left: 4px;
    }
    .comp-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .comp-item {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s;
      color: #94a3b8;
    }
    .comp-item:hover {
      border-color: #3b82f6;
      color: #e2e8f0;
      background: #1e293b;
    }
    .comp-item svg { width: 22px; height: 22px; }
    .comp-item span { font-size: 10px; text-align: center; line-height: 1.2; }
    .comp-block {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .comp-block:hover {
      border-color: #3b82f6;
      background: #1e293b;
    }
    .comp-block svg { width: 18px; height: 18px; flex-shrink: 0; color: #60a5fa; }

    /* 中间编辑区 */
    .editor-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .editor-toolbar {
      background: #1e293b;
      padding: 6px 12px;
      border-bottom: 1px solid #334155;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    .editor-toolbar input {
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
      width: 180px;
    }
    .editor-toolbar input:focus { border-color: #3b82f6; }
    .split-view { flex: 1; display: flex; overflow: hidden; }
    .code-panel, .preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .code-panel { border-right: 1px solid #334155; }
    .panel-header {
      background: #1e293b;
      padding: 6px 12px;
      font-size: 12px;
      color: #94a3b8;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    textarea#code {
      flex: 1;
      background: #0f172a;
      color: #e2e8f0;
      border: none;
      padding: 14px;
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: none;
      outline: none;
    }
    iframe#preview {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }

    /* 右侧项目列表 */
    .project-panel {
      width: 220px;
      background: #1e293b;
      border-left: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .project-list { flex: 1; overflow-y: auto; padding: 8px; }
    .project-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.15s;
    }
    .project-item:hover { background: #334155; }
    .project-item.active { background: #3b82f6; }
    .project-item .title { font-size: 13px; font-weight: 500; }
    .project-item .meta { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .project-item.active .meta { color: #bfdbfe; }

    /* 弹窗 */
    .modal-mask {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-mask.show { display: flex; }
    .modal {
      background: #1e293b;
      border-radius: 12px;
      padding: 24px;
      width: 400px;
      max-width: 92vw;
      border: 1px solid #334155;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal h2 { font-size: 18px; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus { border-color: #3b82f6; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions button { flex: 1; }
    .error-msg { color: #f87171; font-size: 13px; margin-top: 6px; }
    .hint { font-size: 12px; color: #64748b; margin-top: 8px; }

    /* 插入提示 */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #16a34a;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>自主 DIY 网页平台</h1>
    <div class="toolbar">
      <span class="status" id="status">就绪 · 无需登录</span>
      <button class="success" onclick="createNewProject()">+ 新建项目</button>
      <button onclick="saveCurrentProject()">保存项目</button>
      <button class="secondary" onclick="showPublishModal()">发布</button>
      <button onclick="exportHTML()">导出代码</button>
      <button class="secondary" onclick="loadExample()">加载示例</button>
      <button class="danger secondary" onclick="clearCode()">清空</button>
    </div>
  </header>

  <div class="main">
    <!-- 左侧：组件库 -->
    <div class="component-panel">
      <div class="panel-tabs">
        <div class="panel-tab active" data-tab="icons" onclick="switchTab('icons')">图标</div>
        <div class="panel-tab" data-tab="nav" onclick="switchTab('nav')">导航</div>
        <div class="panel-tab" data-tab="btn" onclick="switchTab('btn')">按钮</div>
        <div class="panel-tab" data-tab="modal" onclick="switchTab('modal')">弹窗</div>
        <div class="panel-tab" data-tab="ecom" onclick="switchTab('ecom')">电商</div>
      </div>
      <div class="component-list" id="componentList"></div>
    </div>

    <!-- 中间：编辑 + 预览 -->
    <div class="editor-area">
      <div class="editor-toolbar">
        <input type="text" id="projectTitle" placeholder="项目标题" value="我的新网页">
        <span style="font-size:12px;color:#64748b;" id="currentProjectHint">当前：未保存的新项目</span>
      </div>
      <div class="split-view">
        <div class="code-panel">
          <div class="panel-header">
            <span>HTML 代码（点击左侧组件可插入）</span>
            <span style="font-size:11px;">Ctrl+S 保存</span>
          </div>
          <textarea id="code" spellcheck="false" placeholder="在这里写代码，或点击左侧组件快速插入..."></textarea>
        </div>
        <div class="preview-panel">
          <div class="panel-header">实时预览</div>
          <iframe id="preview"></iframe>
        </div>
      </div>
    </div>

    <!-- 右侧：项目列表 -->
    <div class="project-panel">
      <div class="panel-header" style="justify-content:space-between;">
        <span>我的项目</span>
        <button style="padding:3px 8px;font-size:11px;" onclick="createNewProject()">新建</button>
      </div>
      <div class="project-list" id="projectList">
        <div style="padding:16px;color:#64748b;font-size:12px;text-align:center;">暂无项目</div>
      </div>
    </div>
  </div>

  <!-- 发布弹窗 -->
  <div class="modal-mask" id="publishModal">
    <div class="modal">
      <h2>发布网页</h2>
      <p class="hint">设置一个简短的访问地址（slug），发布后可通过 /p/你的slug 访问</p>
      <div class="form-group">
        <label>访问地址 slug</label>
        <input type="text" id="publishSlug" placeholder="例如：my-shop">
      </div>
      <div id="previewPublishUrl" style="background:#0f172a;padding:10px;border-radius:6px;font-family:monospace;font-size:12px;word-break:break-all;border:1px solid #334155;"></div>
      <div class="error-msg" id="publishError"></div>
      <div class="modal-actions">
        <button class="secondary" onclick="hidePublishModal()">取消</button>
        <button class="success" onclick="doPublish()">确认发布</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
  <p style="margin:16px 0 8px;font-size:15px;color:#6b7280;">购物车是空的</p>
  <p style="margin:0 0 20px;font-size:13px;color:#9ca3af;">快去挑选心仪的商品吧</p>
  <button style="background:#3b82f6;color:#fff;border:none;padding:10px 28px;border-radius:20px;font-size:14px;cursor:pointer;">去逛逛</button>
</div>`
        }
      ]
    };

    // ==================== 状态 ====================
    const codeEl = document.getElementById('code');
    const preview = document.getElementById('preview');
    const statusEl = document.getElementById('status');
    const projectListEl = document.getElementById('projectList');
    const projectTitleEl = document.getElementById('projectTitle');
    const currentProjectHint = document.getElementById('currentProjectHint');

    let currentProjectId = null;
    let currentTab = 'icons';
    const STORAGE_KEY = 'diy-projects-v2';
    const CLIENT_ID = localStorage.getItem('diy-client-id') || (() => {
      const id = 'c_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('diy-client-id', id);
      return id;
    })();

    // ==================== 组件库渲染 ====================
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.panel-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
      });
      renderComponents();
    }

    function renderComponents() {
      const list = document.getElementById('componentList');
      const items = COMPONENTS[currentTab] || [];

      if (currentTab === 'icons') {
        list.innerHTML = `
          <div class="comp-category">
            <div class="comp-category-title">纯色图标（点击插入 SVG）</div>
            <div class="comp-grid">
              ${items.map((item, i) => `
                <div class="comp-item" onclick="insertComponent('icons', ${i})" title="${item.name}">
                  ${item.code}
                  <span>${item.name}</span>
                </div>
              `).join('')}
            </div>
          </div>
          <p style="font-size:11px;color:#64748b;padding:8px 4px;line-height:1.5;">
            提示：图标使用 currentColor，插入后可通过 CSS color 改变颜色。例如外层加 style="color:#ef4444"
          </p>
        `;
      } else {
        const titles = { nav: '导航栏组件', btn: '按钮 & 标签', modal: '弹窗组件', ecom: '电商常用组件' };
        list.innerHTML = `
          <div class="comp-category">
            <div class="comp-category-title">${titles[currentTab] || ''}</div>
            ${items.map((item, i) => `
              <div class="comp-block" onclick="insertComponent('${currentTab}', ${i})">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                ${item.name}
              </div>
            `).join('')}
          </div>
        `;
      }
    }

    function insertComponent(category, index) {
      const item = COMPONENTS[category][index];
      if (!item) return;

      const code = item.code;
      const textarea = codeEl;
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const before = textarea.value.substring(0, start);
      const after = textarea.value.substring(end);

      // 在光标位置插入，前后加换行方便阅读
      const insertText = (before && !before.endsWith('\n') ? '\n' : '') + code + '\n';
      textarea.value = before + insertText + after;

      // 恢复光标
      const newPos = start + insertText.length;
      textarea.selectionStart = textarea.selectionEnd = newPos;
      textarea.focus();

      updatePreview();
      showToast(`已插入「${item.name}」`);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1800);
    }

    // ==================== 预览 & 编辑 ====================
    function updatePreview() {
      const doc = preview.contentDocument || preview.contentWindow.document;
      doc.open();
      doc.write(codeEl.value);
      doc.close();
      statusEl.textContent = '已更新 ' + new Date().toLocaleTimeString();
    }

    codeEl.addEventListener('input', () => {
      updatePreview();
      // 自动本地备份
      localStorage.setItem('diy-current-code', codeEl.value);
    });

    // ==================== 项目管理（纯本地，无需登录） ====================
    function getProjects() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      } catch {
        return {};
      }
    }

    function saveProjects(obj) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
    }

    function renderProjectList() {
      const projects = getProjects();
      const list = Object.values(projects).sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
      if (list.length === 0) {
        projectListEl.innerHTML = '<div style="padding:16px;color:#64748b;font-size:12px;text-align:center;">暂无项目<br>点击「新建项目」开始</div>';
        return;
      }
      projectListEl.innerHTML = list.map(p => `
        <div class="project-item ${p.id === currentProjectId ? 'active' : ''}" onclick="openProject('${p.id}')">
          <div class="title">${escapeHtml(p.title)}</div>
          <div class="meta">${new Date(p.updated_at).toLocaleString()}</div>
        </div>
      `).join('');
    }

    function createNewProject() {
      currentProjectId = null;
      projectTitleEl.value = '我的新网页';
      currentProjectHint.textContent = '当前：未保存的新项目';
      codeEl.value = getDefaultHTML();
      updatePreview();
      renderProjectList();
      showToast('已创建新项目，开始搭建吧');
    }

    function saveCurrentProject() {
      const title = projectTitleEl.value.trim() || '未命名项目';
      const html = codeEl.value;
      if (!html.trim()) {
        alert('代码不能为空');
        return;
      }
      const projects = getProjects();
      const now = new Date().toISOString();
      const id = currentProjectId || ('p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));

      projects[id] = {
        id,
        title,
        html,
        updated_at: now,
        created_at: projects[id]?.created_at || now
      };
      saveProjects(projects);
      currentProjectId = id;
      currentProjectHint.textContent = '当前：' + title;
      renderProjectList();
      statusEl.textContent = '已保存 ' + new Date().toLocaleTimeString();
      showToast('项目已保存到本地');

      // 同时尝试同步到服务器（可选，失败不影响）
      fetch('/api/projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, title, html, clientId: CLIENT_ID })
      }).catch(() => {});
    }

    function openProject(id) {
      const projects = getProjects();
      const p = projects[id];
      if (!p) return;
      currentProjectId = id;
      projectTitleEl.value = p.title;
      currentProjectHint.textContent = '当前：' + p.title;
      codeEl.value = p.html;
      updatePreview();
      renderProjectList();
      showToast('已打开：' + p.title);
    }

    function exportHTML() {
      const title = projectTitleEl.value.trim() || 'my-website';
      const blob = new Blob([codeEl.value], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = title.replace(/[\\/:*?"<>|]/g, '_') + '.html';
      a.click();
      URL.revokeObjectURL(url);
      showToast('代码已导出');
    }

    function clearCode() {
      if (confirm('确定清空当前代码吗？')) {
        codeEl.value = '';
        updatePreview();
      }
    }

    function loadExample() {
      codeEl.value = getDefaultHTML();
      updatePreview();
      showToast('已加载示例页面');
    }

    function getDefaultHTML() {
      return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的电商页面</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; color: #111; padding-bottom: 70px; }
  </style>
</head>
<body>
  <!-- 从左侧组件库点击插入导航、商品卡片、按钮等来搭建你的页面 -->
  <div style="padding:40px 20px;text-align:center;color:#9ca3af;">
    <p style="font-size:15px;margin-bottom:8px;">开始搭建你的网页</p>
    <p style="font-size:13px;">点击左侧「图标 / 导航 / 按钮 / 弹窗 / 电商」组件即可插入</p>
  </div>
</body>
</html>`;
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ==================== 发布 ====================
    function showPublishModal() {
      if (!currentProjectId) {
        alert('请先保存项目，再发布');
        return;
      }
      document.getElementById('publishError').textContent = '';
      document.getElementById('publishSlug').value = '';
      document.getElementById('previewPublishUrl').textContent = location.origin + '/p/xxx';
      document.getElementById('publishModal').classList.add('show');
      document.getElementById('publishSlug').oninput = (e) => {
        const slug = e.target.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
        document.getElementById('previewPublishUrl').textContent = location.origin + '/p/' + (slug || 'xxx');
      };
    }

    function hidePublishModal() {
      document.getElementById('publishModal').classList.remove('show');
    }

    async function doPublish() {
      const slug = document.getElementById('publishSlug').value.trim().toLowerCase();
      const errEl = document.getElementById('publishError');
      errEl.textContent = '';
      if (!/^[a-z0-9-]{3,30}$/.test(slug)) {
        errEl.textContent = 'slug 只能包含小写字母、数字和短横线，长度 3-30';
        return;
      }
      try {
        // 先确保最新代码已同步
        await fetch('/api/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: currentProjectId,
            title: projectTitleEl.value.trim(),
            html: codeEl.value,
            clientId: CLIENT_ID
          })
        });
        const res = await fetch('/api/projects/' + currentProjectId + '/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '发布失败');
        hidePublishModal();
        alert('发布成功！\\n访问地址：' + location.origin + data.url);
        showToast('发布成功');
      } catch (e) {
        errEl.textContent = e.message;
      }
    }

    // ==================== 快捷键 ====================
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        saveCurrentProject();
      }
    });

    // ==================== 初始化 ====================
    function init() {
      renderComponents();
      renderProjectList();

      // 恢复上次编辑内容
      const lastCode = localStorage.getItem('diy-current-code');
      if (lastCode) {
        codeEl.value = lastCode;
      } else {
        codeEl.value = getDefaultHTML();
      }
      updatePreview();
    }

    init();
  </script>
</body>
</html>
